<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="求职进度追踪器：每天的投递、OA 和面试，毕业倒计时和 OPT 提醒。数据只保存在你的浏览器里。">
<title>求职进度</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: header + track filter → today & funnel → 21-day chart beside upcoming deadlines → application log grouped by day */
:root{
  color-scheme:light;
  --bg:#ECEFF3; --surface:#FFFFFF; --field:#F4F6F8; --ink:#14202B; --muted:#586979;
  --line:#D7DFE6; --line-soft:#E6EBF0; --focus:#3B5BDB; --scrim:rgba(12,20,28,.5);
  --ng:#3B5BDB; --ng-soft:#E6EBFD; --ng-fg:#2B45B5;
  --in:#0E9384; --in-soft:#D9F2EE; --in-fg:#0A6F63;
  --sa-bg:#E6EBF0; --sa-fg:#4A5A68;
  --so-bg:#FBEBC8; --so-fg:#8A5600;
  --si-bg:#E8E2FA; --si-fg:#5238B8;
  --sf-bg:#D5EFDB; --sf-fg:#17682F;
  --sr-bg:#F6DCDC; --sr-fg:#9F2A2A;
  --warn:#B3261E; --warn-bg:#F9E1DF;
  --img-bg:#FCFCFB;
  --font-display:"Bricolage Grotesque","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --font-body:system-ui,-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D141B; --surface:#151F28; --field:#0F1820; --ink:#E7EEF4; --muted:#93A4B3;
    --line:#26343F; --line-soft:#1D2933; --focus:#8FA6FF; --scrim:rgba(0,0,0,.62);
    --ng:#7C98FF; --ng-soft:#1D2750; --ng-fg:#A9BBFF;
    --in:#3FC9B5; --in-soft:#11302C; --in-fg:#7BE0D1;
    --sa-bg:#202C36; --sa-fg:#A6B5C2;
    --so-bg:#3A2D10; --so-fg:#F0C168;
    --si-bg:#2A2150; --si-fg:#B9A8F5;
    --sf-bg:#12301C; --sf-fg:#7DD596;
    --sr-bg:#3A1C1C; --sr-fg:#F29A9A;
    --warn:#F2877F; --warn-bg:#3A1D1B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D141B; --surface:#151F28; --field:#0F1820; --ink:#E7EEF4; --muted:#93A4B3;
  --line:#26343F; --line-soft:#1D2933; --focus:#8FA6FF; --scrim:rgba(0,0,0,.62);
  --ng:#7C98FF; --ng-soft:#1D2750; --ng-fg:#A9BBFF;
  --in:#3FC9B5; --in-soft:#11302C; --in-fg:#7BE0D1;
  --sa-bg:#202C36; --sa-fg:#A6B5C2;
  --so-bg:#3A2D10; --so-fg:#F0C168;
  --si-bg:#2A2150; --si-fg:#B9A8F5;
  --sf-bg:#12301C; --sf-fg:#7DD596;
  --sr-bg:#3A1C1C; --sr-fg:#F29A9A;
  --warn:#F2877F; --warn-bg:#3A1D1B;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:24px 64px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono)}

/* header */
.top{display:flex;flex-wrap:wrap;gap:14px 16px;align-items:flex-end;justify-content:space-between}
.eyebrow{font:500 12px/1.2 var(--font-mono);letter-spacing:.04em;color:var(--muted);margin:0 0 8px}
h1{font:700 32px/1.1 var(--font-display);letter-spacing:-.01em;margin:0;text-wrap:balance}
.top-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;min-height:38px}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.btn.sm{padding:3px 10px;min-height:28px;font-size:13px}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.seg button,.seg-opt span{display:block;border:0;background:transparent;padding:6px 12px;border-radius:8px;white-space:nowrap}
.seg button[aria-pressed="true"],.seg-opt input:checked + span{background:var(--ink);color:var(--bg)}
.seg-opt{position:relative;display:block}
.seg-opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg-opt span{cursor:pointer}
.seg-opt input:focus-visible + span{outline:2px solid var(--focus);outline-offset:2px}
input,select,textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px}
textarea{resize:vertical;line-height:1.5}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}

.banner{border:1px solid var(--warn);background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.label>span:first-child{white-space:nowrap}
.label{font:500 12px/1.2 var(--font-mono);letter-spacing:.05em;color:var(--muted);margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.row2{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:860px){
  .r-a{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
  .r-b{grid-template-columns:minmax(0,8fr) minmax(0,5fr)}
}

/* today */
.big{display:flex;align-items:baseline;gap:8px}
.big b{font:700 60px/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.big span{font:500 18px var(--font-mono);color:var(--muted)}
.meter{height:8px;border-radius:4px;background:var(--line-soft);display:flex;overflow:hidden;margin:14px 0 10px}
.meter i{display:block;height:100%}
.meter .ng{background:var(--ng)} .meter .in{background:var(--in)}
.today-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.today-meta b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.goal{display:inline-flex;align-items:center;gap:6px;font-size:12px}
.goal button{width:24px;height:24px;border:1px solid var(--line);background:var(--field);border-radius:6px;line-height:1;padding:0}
.goal b{font-family:var(--font-mono);min-width:1.5em;text-align:center;color:var(--ink)}
.done-flag{color:var(--sf-fg);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft)}
.stats div{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.stats b{font:600 22px/1.1 var(--font-display);color:var(--ink);font-variant-numeric:tabular-nums}

/* funnel */
.funnel{display:flex;flex-direction:column;gap:12px}
.f-row{display:grid;grid-template-columns:48px minmax(0,1fr) 40px 44px;gap:10px;align-items:center}
.f-row .nm{font-size:13px}
.f-bar{height:12px;border-radius:6px;background:var(--line-soft);overflow:hidden}
.f-bar i{display:block;height:100%;border-radius:6px;min-width:0}
.f-row .n{font:600 16px var(--font-display);text-align:right;font-variant-numeric:tabular-nums}
.f-row .p{font:400 12px var(--font-mono);color:var(--muted);text-align:right}
.f-foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft);display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.f-foot b{color:var(--ink);font-variant-numeric:tabular-nums}

/* chart */
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font:400 12px var(--font-body);color:var(--muted);letter-spacing:0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px}
.legend i.dot{border-radius:50%}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .ax{fill:var(--muted);font:10px var(--font-mono)}
.chart .grid{stroke:var(--line-soft);stroke-width:1}
.chart .base{stroke:var(--line);stroke-width:1}
.chart .b-ng{fill:var(--ng)} .chart .b-in{fill:var(--in)}
.chart .m-oa{fill:var(--so-fg)} .chart .m-iv{fill:var(--si-fg)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover,.chart .hit.sel{fill:var(--line-soft)}
.chart .empty{fill:var(--muted);font:13px var(--font-body);text-anchor:middle}
.readout{margin:10px 0 0;font-size:13px;min-height:1.5em;color:var(--ink)}

/* upcoming */
.up{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.up li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.up li:last-child{border-bottom:0}
.up-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left;background:none;border:0;padding:0}
.up-main b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up-main span{font-size:12px;color:var(--muted)}
.when{font:500 12px var(--font-mono);padding:2px 8px;border-radius:999px;background:var(--sa-bg);color:var(--sa-fg);white-space:nowrap}
.when.soon{background:var(--so-bg);color:var(--so-fg)}
.when.late{background:var(--warn-bg);color:var(--warn)}
.empty-note{color:var(--muted);margin:0;font-size:13px;max-width:46ch}
.gate{margin:0 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);font-size:13px;display:flex;flex-direction:column;gap:3px}
.gate b{font-size:14px}
.gate .muted{font-size:12px}
.gate.ok{background:var(--sf-bg);border-color:transparent;color:var(--sf-fg)}
.gate.ok b{color:var(--sf-fg)}
.gate .bad{color:var(--warn)}
.up-sub{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted)}
.up-sub b{color:var(--ink)}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.picks .btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* log */
.log-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:4px}
.log-bar h2{font:700 20px/1.2 var(--font-display);margin:0;flex:1 1 140px}
.log-bar h2 small{font:400 12px var(--font-mono);color:var(--muted);margin-left:6px}
.log-bar input{flex:1 1 160px;max-width:260px}
.log-bar select{flex:0 0 auto;width:auto}
@media (max-width:640px){.log-bar input{max-width:none;flex-basis:100%}.log-bar select{flex:1 1 100%;width:100%}}
.day-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:16px 4px 6px;font:500 12px var(--font-mono);letter-spacing:.03em;color:var(--muted);border-bottom:1px solid var(--line)}
.day-h b{color:var(--ink);font-weight:500}
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:minmax(0,1.5fr) 100px 76px minmax(0,1.2fr);grid-template-areas:"main tag pill last";gap:4px 12px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line-soft);border-radius:6px;padding:10px 4px}
.row:hover{background:var(--field)}
.r-main{grid-area:main;min-width:0;display:flex;flex-direction:column}
.r-main b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-main span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tag{grid-area:tag}
.row .pill{grid-area:pill;justify-self:start}
.r-last{grid-area:last;min-width:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){
  .row{grid-template-columns:minmax(0,1fr) max-content max-content;grid-template-areas:"main tag pill" "last last last";align-items:center}
  .row .pill{justify-self:end}
}
.tag{display:inline-block;font:500 12px/1.5 var(--font-mono);padding:0 7px;border-radius:4px;justify-self:start;white-space:nowrap}
.tag.ng{background:var(--ng-soft);color:var(--ng-fg)}
.tag.intern{background:var(--in-soft);color:var(--in-fg)}
.pill{display:inline-block;font-size:12px;font-weight:600;line-height:1.5;padding:1px 9px;border-radius:999px;white-space:nowrap}
.st-applied,.st-withdrawn{background:var(--sa-bg);color:var(--sa-fg)}
.st-withdrawn{font-style:italic}
.st-oa{background:var(--so-bg);color:var(--so-fg)}
.st-interview{background:var(--si-bg);color:var(--si-fg)}
.st-expired{background:var(--sa-bg);color:var(--so-fg);font-style:italic}
.st-offer{background:var(--sf-bg);color:var(--sf-fg)}
.st-rejected{background:var(--sr-bg);color:var(--sr-fg)}
.log-empty{padding:28px 4px 12px}
.log-empty b{display:block;font:700 18px var(--font-display);margin-bottom:6px}

/* modal */
.overlay{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));overflow-y:auto;z-index:20}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:100%;max-width:580px;margin-block:2vh;padding:20px;min-width:0}
.m-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.m-head>.btn{white-space:nowrap;flex-shrink:0}
.m-head h3{font:700 22px/1.2 var(--font-display);margin:0;overflow-wrap:anywhere}
.m-head p{margin:2px 0 0;color:var(--muted);overflow-wrap:anywhere}
.m-sec{padding-top:16px;margin-top:16px;border-top:1px solid var(--line-soft)}
.m-sec:first-of-type{border-top:0;margin-top:0;padding-top:0}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span.lbl{font-size:12px;color:var(--muted)}
.form-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:16px}
.form-foot .note{font-size:13px;color:var(--muted)}
.tabs{display:flex;margin-bottom:16px}
.hint{font-size:12px;color:var(--muted);margin:4px 0 0}
.tl{list-style:none;margin:0 0 16px;padding:0 0 0 6px;border-left:2px solid var(--line)}
.tl li{position:relative;display:flex;gap:10px;justify-content:space-between;padding:0 0 12px 16px}
.tl li::before{content:"";position:absolute;left:-7px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--sa-fg);border:2px solid var(--surface)}
.tl li.k-oa::before{background:var(--so-fg)}
.tl li.k-screen::before,.tl li.k-interview::before{background:var(--si-fg)}
.tl li.k-offer::before{background:var(--sf-fg)}
.tl li.k-rejected::before{background:var(--sr-fg)}
.tl .tl-body{min-width:0}
.tl .tl-body p{margin:2px 0 0;color:var(--muted);overflow-wrap:anywhere}
.tl .due{display:inline-block;font:400 12px var(--font-mono);color:var(--so-fg);margin-left:6px}
.tl .is-done .due{text-decoration:line-through;color:var(--muted)}
.tl .tl-act{display:flex;gap:6px;flex-shrink:0;align-items:flex-start}
.linkout{font-size:13px}
.mail-item{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;background:var(--field)}
.mail-item.off{opacity:.55}
.mail-item input,.mail-item select{background:var(--surface)}
.chk{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px}
.chk input{width:auto;min-height:0;padding:0;margin:0}
.match{font-size:12px;color:var(--muted)}
.sync-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.sync-bar .field{flex:1 1 200px}
.sync-sum{margin:0;font-size:13px;color:var(--muted)}
.sync-pick{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.mail-src{margin:8px 0 0;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.mail-src a{white-space:nowrap}
.file-btn{display:inline-flex;align-items:center;cursor:pointer}
.modal.wide{max-width:1040px}
.sk-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.sk-bar .field{flex:1 1 150px}
.sk-fig{background:var(--img-bg);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sk-scroll{overflow-x:auto}
.sk-scroll svg{display:block;width:100%;min-width:860px;height:auto}
.sk-fig img{display:block;width:100%;height:auto}
.sk-note{margin:0;font-size:12px;color:var(--muted)}
.sk-data summary{cursor:pointer;font-size:13px;color:var(--muted)}
.sk-data .sk-tbl{overflow-x:auto;margin-top:8px}
.sk-data table{border-collapse:collapse;width:100%;font-size:13px}
.sk-data th,.sk-data td{text-align:left;font-weight:400;padding:5px 8px;border-bottom:1px solid var(--line-soft)}
.sk-data th{color:var(--muted);font-size:12px}
.sk-data td.n,.sk-data th.n{text-align:right;font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.form .chk{grid-column:1/-1;margin:0}
.when.ok{background:var(--sf-bg);color:var(--sf-fg)}
.grad-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
@media (min-width:860px){.grad-grid{grid-template-columns:minmax(0,4fr) minmax(0,8fr)}}
.count .big b{font-size:64px}
.count p{margin:8px 0 0}
.count-empty{display:flex;flex-direction:column;gap:6px;margin:0 0 12px}
.count-empty b{font:700 20px/1.2 var(--font-display)}
.next{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line-soft);font-size:13px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.ms{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ms li{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line-soft);align-items:start}
.ms li:first-child{padding-top:0}
.ms li:last-child{border-bottom:0}
.ms .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);margin-top:4px}
.ms .done .dot{background:var(--sf-fg);border-color:var(--sf-fg)}
.ms .late .dot{border-color:var(--warn)}
.ms .t{font-weight:600}
.ms .done .t{color:var(--muted);font-weight:500}
.ms .nt{font-size:12px;color:var(--muted)}
.unemp{margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft)}
.unemp .u-head{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.unemp .u-head b{font:600 18px var(--font-display);font-variant-numeric:tabular-nums}
.unemp .meter{margin:8px 0 6px}
.unemp .meter i{background:var(--si-fg)}
.unemp .meter i.warn{background:var(--warn)}
.disclaimer{font-size:12px;color:var(--muted);margin:12px 0 0;max-width:70ch}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;font-size:12px;color:var(--muted);padding:4px 2px 0}
.foot-act{display:inline-flex;flex-wrap:wrap;align-items:center;gap:8px}
a{color:var(--focus)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:30;max-width:calc(100% - 32px);text-align:center}
.toast.bad{background:var(--warn);color:#fff}
@media (max-width:600px){input,select,textarea{font-size:16px}h1{font-size:28px}}
@media (prefers-reduced-motion:no-preference){.meter i,.f-bar i{transition:width .25s ease}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow" id="eyebrow">&nbsp;</p>
      <h1>求职进度</h1>
    </div>
    <div class="top-actions">
      <div class="seg" role="group" aria-label="按类型筛选">
        <button type="button" data-track="all" aria-pressed="true">全部</button>
        <button type="button" data-track="ng" aria-pressed="false">New Grad</button>
        <button type="button" data-track="intern" aria-pressed="false">Intern</button>
      </div>
      <button type="button" class="btn" id="btn-sankey" data-act="open-sankey">进度图</button>
      <button type="button" class="btn" id="btn-sync" data-act="open-sync" hidden>同步邮箱</button>
      <button type="button" class="btn" id="btn-mail" data-act="open-mail">粘贴邮件</button>
      <button type="button" class="btn primary" id="btn-add" data-act="open-add">+ 记录投递</button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <section class="row2 r-a">
    <div class="card">
      <p class="label"><span>今天投递</span><span class="goal" id="goal"></span></p>
      <div id="today"></div>
    </div>
    <div class="card">
      <p class="label"><span>进展漏斗</span><span class="muted" id="funnel-total"></span></p>
      <div id="funnel"></div>
    </div>
  </section>

  <section class="card" id="gradcard">
    <p class="label"><span>毕业与 OPT</span><button type="button" class="btn sm" id="btn-grad" data-act="open-grad">设置</button></p>
    <div id="grad"></div>
  </section>

  <section class="row2 r-b">
    <div class="card">
      <p class="label"><span>最近 21 天</span>
        <span class="legend"><span><i style="background:var(--ng)"></i>New Grad</span><span><i style="background:var(--in)"></i>Intern</span><span><i class="dot" style="background:var(--so-fg)"></i>OA</span><span><i class="dot" style="background:var(--si-fg)"></i>面试</span></span>
      </p>
      <div id="chart"></div>
      <p class="readout" id="readout"></p>
    </div>
    <div class="card">
      <p class="label"><span>待办 OA 和面试</span><button type="button" class="btn sm" id="btn-todo" data-act="open-todo">+ 添加待办</button></p>
      <div id="upcoming"></div>
    </div>
  </section>

  <section class="card">
    <div class="log-bar">
      <h2>投递记录<small id="log-count"></small></h2>
      <input type="search" id="q" placeholder="搜索公司、职位、备注" aria-label="搜索投递记录" autocomplete="off">
      <select id="status" aria-label="按状态筛选">
        <option value="all">全部状态</option>
        <option value="applied">已投递（暂无回音）</option>
        <option value="oa">OA</option>
        <option value="expired">OA 过期（没做）</option>
        <option value="interview">面试中</option>
        <option value="offer">Offer</option>
        <option value="rejected">已拒</option>
        <option value="withdrawn">已撤回</option>
      </select>
      <select id="sort" aria-label="排序">
        <option value="applied">按投递日期</option>
        <option value="recent">按最近进展</option>
      </select>
    </div>
    <div id="log"></div>
  </section>
  <footer class="foot" id="foot"></footer>
</div>

<div id="overlay" class="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title" id="modal"></div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, v); } catch(e){} }
};
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const parse = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); };
const todayStr = () => ymd(new Date());
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const diffDays = (a,b) => Math.round((parse(a) - parse(b)) / 864e5);
const WD = ['日','一','二','三','四','五','六'];
const fmt = s => { const d = parse(s); return (d.getMonth()+1) + '月' + d.getDate() + '日 周' + WD[d.getDay()]; };
const short = s => { const d = parse(s); return (d.getMonth()+1) + '/' + d.getDate(); };
const isDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';

const KINDS = {
  oa:        { label:'OA',           status:'oa',        due:'OA 截止' },
  screen:    { label:'电话 / HR 面',  status:'interview', due:'面试' },
  interview: { label:'技术面 / 终面', status:'interview', due:'面试' },
  offer:     { label:'Offer',        status:'offer' },
  rejected:  { label:'拒信',          status:'rejected' },
  withdrawn: { label:'主动撤回',      status:'withdrawn' }
};
const STATUS = { applied:'已投递', oa:'OA', expired:'OA 过期', interview:'面试中', offer:'Offer', rejected:'已拒', withdrawn:'已撤回' };
const TRACK = { ng:'New Grad', intern:'Intern' };

const S = { db:null, sample:null, mcp:null, dl:null, mailsync:{}, settings:{}, mode:'cloud', apps:[], loaded:false, goal:5, track:'all', q:'', status:'all', sort:'applied', modal:null, readDay:null, lastFocus:null };
(function(){ const t = ls.get('jt-track'); if (t === 'ng' || t === 'intern') S.track = t; })();

const trackOf = a => a.track === 'intern' ? 'intern' : 'ng';
/* Only an application record counts toward the totals (today, funnel, chart, flow chart): one added with
   "+ 记录投递" or made from an application-confirmation email. A record that only exists because an
   OA / interview / rejection was added for a company with no application (by hand with
   "+ 添加待办", or from an email) is kept in the log marked `uncounted`. An offer is the exception:
   you cannot get one without having applied, so recording an offer makes the record count. */
const isCounted = a => a.uncounted !== true;
/* Type rule: only the job title decides. It is an Intern only if the title says so; everything else
   (including an unknown title) is New Grad / full-time. */
const INTERN_RE = /\b(?:intern|interns|internship|internships|co-?op)\b|实习/i;
const trackFromRole = role => INTERN_RE.test(String(role || '')) ? 'intern' : 'ng';
/* An OA that passed its deadline without being done is marked `missed`; that application's status is then 'expired'. */
const statusOf = a => { const ev = a.events || []; if (!ev.length) return 'applied'; const l = ev[ev.length-1]; return l.kind === 'oa' && l.missed === true ? 'expired' : (KINDS[l.kind] || {}).status || 'applied'; };
const reached = (a, kinds) => (a.events || []).some(e => kinds.indexOf(e.kind) >= 0);

/* ---------- write queue ---------- */
let chain = Promise.resolve();
function save(fn){ const p = chain.then(fn); chain = p.catch(function(){}); return p; }
function fail(e){
  const c = e && e.code;
  toast(c === 'quota_exceeded' ? '数据库已满，请先删除一些旧记录' : c === 'invalid_argument' ? '没有写入权限，当前账号只能查看' : '保存失败，请稍后再试', true);
}
let toastT;
function toast(msg, bad, ms){
  const el = $('#toast');
  el.textContent = msg; el.className = 'toast' + (bad ? ' bad' : ''); el.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(function(){ el.hidden = true; }, ms || 3200);
}

/* ---------- render: summary ---------- */
function renderToday(L, t){
  const todays = L.filter(a => a.appliedOn === t);
  const ng = todays.filter(a => trackOf(a) === 'ng').length;
  const it = todays.length - ng;
  const denom = Math.max(S.goal, todays.length);
  let week = 0;
  for (let i = 0; i < 7; i++){ const d = addDays(t, -i); week += L.filter(a => a.appliedOn === d).length; }
  const days = new Set(L.map(a => a.appliedOn));
  let streak = 0, d = days.has(t) ? t : addDays(t, -1);
  while (days.has(d)) { streak++; d = addDays(d, -1); }
  const reachedGoal = todays.length >= S.goal;

  $('#goal').innerHTML = '每天目标 <button type="button" data-act="goal" data-d="-1" aria-label="减少目标">−</button><b>' + S.goal + '</b><button type="button" data-act="goal" data-d="1" aria-label="增加目标">+</button>';
  $('#today').innerHTML =
    '<div class="big"><b>' + todays.length + '</b><span>/ ' + S.goal + '</span></div>' +
    '<div class="meter" aria-hidden="true"><i class="ng" style="width:' + (ng/denom*100) + '%"></i><i class="in" style="width:' + (it/denom*100) + '%"></i></div>' +
    '<div class="today-meta"><span>New Grad <b>' + ng + '</b></span><span>Intern <b>' + it + '</b></span>' + (reachedGoal ? '<span class="done-flag">今日目标已完成</span>' : '<span>还差 <b>' + (S.goal - todays.length) + '</b> 个</span>') + '</div>' +
    '<div class="stats"><div><b>' + week + '</b>近 7 天投递</div><div><b>' + (week/7).toFixed(1) + '</b>日均</div><div><b>' + streak + '</b>连续投递天数</div></div>';
}

function renderFunnel(L, U){
  const total = L.length;
  const oa = L.filter(a => reached(a, ['oa'])).length;
  const iv = L.filter(a => reached(a, ['screen','interview'])).length;
  const of = L.filter(a => reached(a, ['offer'])).length;
  const rej = L.filter(a => statusOf(a) === 'rejected').length;
  const wd = L.filter(a => statusOf(a) === 'withdrawn').length;
  const wait = L.filter(a => statusOf(a) === 'applied').length;
  const exp = L.filter(a => statusOf(a) === 'expired').length;
  const rejU = (U || []).filter(a => statusOf(a) === 'rejected').length;   // 没有投递记录的拒信：不算投递，但拒信还是要数
  const rows = [['投递', total, 'var(--sa-fg)'], ['OA', oa, 'var(--so-fg)'], ['面试', iv, 'var(--si-fg)'], ['Offer', of, 'var(--sf-fg)']];
  $('#funnel-total').textContent = total ? '共 ' + total + ' 个投递' : '';
  $('#funnel').innerHTML = '<div class="funnel">' + rows.map(function(r, i){
    const w = total ? Math.max(r[1] ? 2 : 0, r[1] / total * 100) : 0;
    const pct = i === 0 ? '' : (total ? Math.round(r[1] / total * 100) + '%' : '–');
    return '<div class="f-row"><span class="nm">' + r[0] + '</span><div class="f-bar"><i style="width:' + w + '%;background:' + r[2] + '"></i></div><span class="n">' + r[1] + '</span><span class="p">' + pct + '</span></div>';
  }).join('') + '</div>' +
  '<div class="f-foot"><span>暂无回音 <b>' + wait + '</b></span><span>OA 过期 <b>' + exp + '</b></span><span>已拒 <b>' + rej + '</b>' + (rejU ? '<span class="muted">（另有 ' + rejU + ' 封没有投递记录）</span>' : '') + '</span><span>主动撤回 <b>' + wd + '</b></span></div>';
}

/* ---------- render: chart ---------- */
let chartDays = {};
function renderChart(L, t){
  const N = 21, W = Math.max(300, Math.round($('#chart').clientWidth)) || 640, H = 232, ml = 28, mr = 6, top = 30, bot = 22;
  const days = Array.from({length:N}, (_, i) => addDays(t, i - (N-1)));
  const by = {};
  days.forEach(d => { by[d] = { ng:0, intern:0, oa:0, iv:0, names:[] }; });
  L.forEach(a => {
    const r = by[a.appliedOn];
    if (r) { r[trackOf(a)]++; r.names.push(a.company); }
    (a.events || []).forEach(e => {
      const r2 = by[e.date]; if (!r2) return;
      if (e.kind === 'oa') r2.oa++; else if (e.kind === 'screen' || e.kind === 'interview') r2.iv++;
    });
  });
  chartDays = by;
  const max = Math.max.apply(null, days.map(d => by[d].ng + by[d].intern));
  const step = max <= 5 ? 1 : max <= 10 ? 2 : max <= 20 ? 5 : 10;
  const ymax = Math.max(5, Math.ceil(max / step) * step);
  const ph = H - top - bot, pw = W - ml - mr, slot = pw / N, bw = slot * .62;
  const y = v => top + ph - v / ymax * ph;
  let g = '';
  for (let v = 0; v <= ymax; v += step){
    g += '<line class="' + (v === 0 ? 'base' : 'grid') + '" x1="' + ml + '" x2="' + (W - mr) + '" y1="' + y(v) + '" y2="' + y(v) + '"/>' +
         '<text class="ax" x="' + (ml - 6) + '" y="' + (y(v) + 3) + '" text-anchor="end">' + v + '</text>';
  }
  let bars = '';
  days.forEach(function(d, i){
    const r = by[d], x = ml + i * slot, cx = x + slot / 2;
    bars += '<g><rect class="hit' + (S.readDay === d ? ' sel' : '') + '" data-day="' + d + '" x="' + x + '" y="0" width="' + slot + '" height="' + (H - bot) + '"><title>' + short(d) + '：' + (r.ng + r.intern) + ' 个投递</title></rect>';
    const hNg = r.ng / ymax * ph, hIn = r.intern / ymax * ph;
    if (r.ng) bars += '<rect class="b-ng" x="' + (cx - bw/2) + '" y="' + (y(0) - hNg) + '" width="' + bw + '" height="' + hNg + '" rx="2" pointer-events="none"/>';
    if (r.intern) bars += '<rect class="b-in" x="' + (cx - bw/2) + '" y="' + (y(0) - hNg - hIn) + '" width="' + bw + '" height="' + hIn + '" rx="2" pointer-events="none"/>';
    if (r.oa) bars += '<circle class="m-oa" cx="' + (cx - (r.iv ? 5 : 0)) + '" cy="12" r="4" pointer-events="none"/>';
    if (r.iv) bars += '<circle class="m-iv" cx="' + (cx + (r.oa ? 5 : 0)) + '" cy="12" r="4" pointer-events="none"/>';
    if ((N - 1 - i) % 7 === 0) bars += '<text class="ax" x="' + cx + '" y="' + (H - 6) + '" text-anchor="middle">' + (i === N - 1 ? '今天' : short(d)) + '</text>';
    bars += '</g>';
  });
  const none = max === 0 && S.loaded ? '<text class="empty" x="' + (ml + pw/2) + '" y="' + (top + ph/2) + '">这 21 天还没有投递记录</text>' : '';
  $('#chart').innerHTML = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="最近 21 天每天投递数量，以及 OA 和面试出现的日期">' + g + bars + none + '</svg>';
  showDay(S.readDay || t);
}
function showDay(d){
  const r = chartDays[d]; if (!r) return;
  S.readDay = d;
  const n = r.ng + r.intern;
  let s = fmt(d) + '：' + (n ? '投递 ' + n + ' 个（' + r.names.slice(0,5).join('、') + (r.names.length > 5 ? ' 等' : '') + '）' : '没有投递');
  if (r.oa) s += ' · OA ' + r.oa;
  if (r.iv) s += ' · 面试 ' + r.iv;
  $('#readout').textContent = s;
  document.querySelectorAll('#chart .hit').forEach(function(el){ el.classList.toggle('sel', el.dataset.day === d); });
}

/* ---------- render: upcoming ---------- */
/* An OA / interview that is marked done does not just drop out: until something newer is recorded
   (another round, an offer, a rejection) it stays listed under "等结果", with how long it has been. */
const waitSince = (e, t) => e.doneOn || (e.due && e.due <= t ? e.due : e.date);
function renderUpcoming(L, t){
  const items = [], waits = [];
  L.forEach(a => {
    const st = statusOf(a);
    if (st === 'rejected' || st === 'withdrawn' || st === 'offer' || st === 'expired') return;
    const ev = a.events || [];
    ev.forEach((e, i) => {
      if (!KINDS[e.kind] || !KINDS[e.kind].due || e.missed) return;
      if (e.done){ if (i === ev.length - 1) waits.push({a:a, e:e, since:waitSince(e, t)}); return; }
      if (e.due || i === ev.length - 1) items.push({a:a, e:e});
    });
  });
  items.sort((x, y) => {
    if (!!x.e.due !== !!y.e.due) return x.e.due ? -1 : 1;
    const kx = x.e.due || x.e.date, ky = y.e.due || y.e.date;
    return kx < ky ? -1 : kx > ky ? 1 : 0;
  });
  waits.sort((x, y) => x.since < y.since ? -1 : x.since > y.since ? 1 : 0);
  if (!items.length && !waits.length){
    $('#upcoming').innerHTML = '<p class="empty-note">' + (S.loaded ? '还没有待办。拿到 OA 或约到面试后，点右上角的「+ 添加待办」，填公司和截止日期，就会出现在这里。' : '读取中…') + '</p>';
    return;
  }
  let html = '';
  if (items.length) html += '<ul class="up">' + items.map(function(x){
    let cls = '', rel = '没填日期', sub = KINDS[x.e.kind].due + ' · 收到于 ' + short(x.e.date) + '，点开补日期';
    if (x.e.due){
      const dd = diffDays(x.e.due, t);
      cls = dd < 0 ? 'late' : dd <= 2 ? 'soon' : '';
      rel = dd < 0 ? '逾期 ' + (-dd) + ' 天' : dd === 0 ? '今天' : dd === 1 ? '明天' : dd + ' 天后';
      sub = KINDS[x.e.kind].due + ' ' + fmt(x.e.due);
    }
    return '<li><button type="button" class="up-main" data-open="' + esc(x.a.id) + '"><b>' + esc(x.a.company) + '</b><span>' + esc(sub) + '</span></button>' +
           '<span class="when ' + cls + '">' + rel + '</span>' +
           (x.e.kind === 'oa' && x.e.due && x.e.due < t && statusOf(x.a) === 'oa' ? '<button type="button" class="btn sm" data-act="missed" data-id="' + esc(x.a.id) + '" data-ev="' + esc(x.e.id) + '" title="OA 已经过了截止日期，没有做">过期没做</button>' : '') +
           '<button type="button" class="btn sm" data-act="done" data-id="' + esc(x.a.id) + '" data-ev="' + esc(x.e.id) + '">完成</button></li>';
  }).join('') + '</ul>';
  else html += '<p class="empty-note">现在没有待办的 OA 或面试。</p>';
  if (waits.length) html += '<p class="up-sub">等结果 <b>' + waits.length + '</b> · 做完了，还没有下一步</p><ul class="up">' + waits.map(function(x){
    const days = Math.max(0, diffDays(t, x.since));
    return '<li><button type="button" class="up-main" data-open="' + esc(x.a.id) + '"><b>' + esc(x.a.company) + '</b><span>' + esc(KINDS[x.e.kind].label) + ' 已完成 · ' + short(x.since) + '</span></button>' +
           '<span class="when ' + (days >= 7 ? 'soon' : '') + '">' + (days === 0 ? '今天' : '已等 ' + days + ' 天') + '</span>' +
           '<button type="button" class="btn sm" data-act="next" data-id="' + esc(x.a.id) + '" data-ev="' + esc(x.e.id) + '">更新进展</button></li>';
  }).join('') + '</ul>';
  $('#upcoming').innerHTML = html;
}

/* ---------- render: log ---------- */
function renderLog(L, t){
  const q = S.q.trim().toLowerCase();
  let list = L.filter(a => (S.status === 'all' || statusOf(a) === S.status) &&
    (!q || (a.company + ' ' + (a.role || '') + ' ' + (a.notes || '') + ' ' + (a.location || '')).toLowerCase().indexOf(q) >= 0));
  list.sort((a, b) => a.appliedOn < b.appliedOn ? 1 : a.appliedOn > b.appliedOn ? -1 : (a.createdAt || '') < (b.createdAt || '') ? 1 : -1);
  $('#log-count').textContent = S.loaded ? list.length + (list.length === L.length ? '' : ' / ' + L.length) : '';
  if (!S.loaded){ $('#log').innerHTML = '<div class="log-empty muted">读取中…</div>'; return; }
  if (!L.length){
    $('#log').innerHTML = '<div class="log-empty"><b>还没有投递记录</b><p class="empty-note">点右上角「+ 记录投递」，填公司和职位就行。一天投了很多个的话，用「批量」一次粘贴多行。拿到 OA 或面试后，点进对应的投递添加进展。</p></div>';
    return;
  }
  if (!list.length){ $('#log').innerHTML = '<div class="log-empty muted">没有符合条件的投递。</div>'; return; }
  const main = list.filter(isCounted), extra = list.filter(a => !isCounted(a));
  const lastOf = a => (a.events || []).reduce((m, e) => isDate(e.date) && e.date > m ? e.date : m, '') || a.appliedOn;
  const row = function(a){
    const ev = a.events || [], last = ev[ev.length - 1];
    let lastTxt = '';
    if (last){
      lastTxt = (KINDS[last.kind] ? KINDS[last.kind].label : last.kind) + ' · ' + short(last.date) + (last.due && !last.done ? ' → ' + short(last.due) : '') + (last.note ? ' · ' + last.note : '');
    }
    return '<li><button type="button" class="row" data-open="' + esc(a.id) + '">' +
      '<span class="r-main"><b>' + esc(a.company) + '</b><span>' + esc(a.role || '未填职位') + (isCounted(a) ? '' : ' · 无投递记录') + '</span></span>' +
      '<span class="tag ' + trackOf(a) + '">' + TRACK[trackOf(a)] + '</span>' +
      '<span class="pill st-' + statusOf(a) + '">' + STATUS[statusOf(a)] + '</span>' +
      '<span class="r-last">' + esc(lastTxt) + '</span></button></li>';
  };
  // 按某个日期分组，每组一个标题
  const section = function(arr, keyOf){
    if (!arr.length) return '';
    const counts = {}; arr.forEach(a => { const k = keyOf(a); counts[k] = (counts[k] || 0) + 1; });
    let cur = null, out = '';
    arr.forEach(function(a){
      const k = keyOf(a);
      if (k !== cur){
        if (cur !== null) out += '</ul>';
        cur = k;
        const dd = diffDays(k, t);
        out += '<div class="day-h"><b>' + (dd === 0 ? '今天' : dd === -1 ? '昨天' : fmt(k)) + (dd === 0 || dd === -1 ? ' · ' + short(k) : '') + '</b><span>' + counts[k] + ' 个</span></div><ul class="rows">';
      }
      out += row(a);
    });
    return out + '</ul>';
  };
  let html;
  if (S.sort === 'recent'){
    // 按最近一次进展的日期排，新的拒信 / OA / 面试排在最前面；没有投递记录的也混在里面，名字后面标出来
    list.sort((a, b) => lastOf(a) < lastOf(b) ? 1 : lastOf(a) > lastOf(b) ? -1 : (a.updatedAt || '') < (b.updatedAt || '') ? 1 : -1);
    html = section(list, lastOf);
  } else {
    html = section(main, a => a.appliedOn);
    if (extra.length){
      // 邮件里出现、但没有对应投递记录的（比如只收到拒信）：不计入投递数，单独放在最下面
      extra.sort((a, b) => lastOf(a) < lastOf(b) ? 1 : lastOf(a) > lastOf(b) ? -1 : 0);
      html = '<p class="hint log-note">另有 ' + extra.length + ' 条记录没有投递记录（多半是只收到拒信的），不计入投递数，排在最下面。<button type="button" class="btn sm" data-act="sort-recent">按最近进展看</button></p>' + html +
        '<div class="day-h"><b>没有投递记录</b><span>' + extra.length + ' 个 · 不计入投递数</span></div><ul class="rows">' + extra.map(row).join('') + '</ul>';
    }
  }
  $('#log').innerHTML = html;
}

function parseLine(line){
  const s = line.trim(); if (!s) return null;
  const m = s.match(/^(.*?)\s*(?:[,，|\t]|\s[-–—]\s)\s*(.+)$/);
  const company = (m ? m[1] : s).trim();
  return company ? { company: company, role: m ? m[2].trim() : '' } : null;
}

/* ---------- shared: add events / create applications ---------- */
const roleKey = r => String(r || '').toLowerCase().replace(/[(（][^)）]*[)）]/g, ' ').replace(/\s+/g, ' ').trim();   // 括号里的缩写（如 "(TDP)"）不算不同的职位
/* 一封「投递确认」邮件对上了记录里已有的这家公司（同公司、同职位或职位没写）时：
   promote = 那条记录原来只有拒信 / 测评、没有投递记录：这封确认才是真正的投递，改成计入投递数，日期用这封邮件的；
   new     = 已有的那条投递在好几天之前：同一家公司的另一次投递（不同的职位编号，名字可能一样），新建一条；
   skip    = 就是同一次投递（前后一天内，比如系统发了两封确认），不再重复记。 */
function appliedMatch(it, list){
  const a = findApp(list, it.company, it.role); if (!a) return null;
  if (a.uncounted === true) return { app: a, mode: 'promote' };
  if (Math.abs(diffDays(it.date, a.appliedOn)) >= 2) return { app: a, mode: 'new' };
  return { app: a, mode: 'skip' };
}
function findApp(list, company, role){
  const c = String(company || '').trim().toLowerCase();
  const m = list.filter(a => String(a.company || '').trim().toLowerCase() === c);
  if (!m.length) return null;
  const r = roleKey(role);
  if (r){
    const exact = m.find(a => roleKey(a.role) === r);
    if (exact) return exact;
    const blank = m.filter(a => !roleKey(a.role));
    return blank.length === 1 ? blank[0] : null;
  }
  return m.slice().sort((a, b) => a.appliedOn < b.appliedOn ? 1 : -1)[0];
}

async function applyItems(items){
  const local = S.apps.map(a => ({ id:a.id, company:a.company, role:a.role || '', appliedOn:a.appliedOn, uncounted:a.uncounted === true, events:(a.events || []).map(e => Object.assign({}, e)) }));
  const res = { created:0, added:0, skipped:0, uncounted:0, promoted:0 };
  for (const it of items){
    let app = findApp(local, it.company, it.role), mode = '';
    if (it.kind === 'applied' && app){ mode = appliedMatch(it, local).mode; if (mode === 'new') app = null; }
    let ev = null;
    if (it.kind !== 'applied'){
      ev = { id: uid(), kind: it.kind, date: it.date, done: false };
      if (it.due) ev.due = it.due;
      if (it.note) ev.note = it.note;
      if (it.src) ev.src = it.src;
    }
    if (!app){
      const now = new Date().toISOString();
      const ref = S.db.collection('apps').doc();
      const data = { company: it.company, role: it.role || '', track: it.track === 'intern' ? 'intern' : 'ng', appliedOn: it.date, link:'', location:'', notes: (!ev && it.note) ? it.note : '', events: ev ? [ev] : [], createdAt: now, updatedAt: now };
      if (it.src) data.src = it.src;
      const unc = !!ev && it.kind !== 'offer';   // 只有 OA / 面试 / 拒信、没有对应的投递：记下，但不当成一次投递；Offer 说明一定投过，算一次
      if (unc){ data.uncounted = true; res.uncounted++; }
      await save(() => ref.set(data));
      local.push({ id: ref.id, company: it.company, role: it.role || '', appliedOn: it.date, uncounted: unc, events: ev ? [ev] : [] });
      res.created++;
    } else if (mode === 'promote'){
      const day = it.date < app.appliedOn ? it.date : app.appliedOn;
      await save(() => S.db.doc('apps/' + app.id).update({ uncounted: false, appliedOn: day, updatedAt: new Date().toISOString() }));
      app.uncounted = false; app.appliedOn = day; res.promoted++;
    } else if (ev){
      app.events.push(ev);
      const events = app.events.map(e => Object.assign({}, e));
      const patch = { events: events, updatedAt: new Date().toISOString() };
      if (it.kind === 'offer' && app.uncounted){ patch.uncounted = false; app.uncounted = false; }
      await save(() => S.db.doc('apps/' + app.id).update(patch));
      res.added++;
    } else res.skipped++;
  }
  return res;
}

function extractJson(text){
  const t = String(text || '').trim();
  try { return JSON.parse(t); } catch(e){}
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if (fence){ try { return JSON.parse(fence[1]); } catch(e){} }
  const i = t.search(/[\[{]/), j = Math.max(t.lastIndexOf(']'), t.lastIndexOf('}'));
  if (i >= 0 && j > i){ try { return JSON.parse(t.slice(i, j + 1)); } catch(e){} }
  return null;
}
