  // 投递确认先建投递，进展按日期先后追加，避免拒信把投递日期带歪
  rows.sort((a, b) => (a.kind === 'applied' ? 0 : 1) - (b.kind === 'applied' ? 0 : 1) || (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  const btn = $('#mail-save'); btn.disabled = true;
  const inSync = S.modal && S.modal.type === 'sync', syncDone = inSync && !S.modal.partial && !S.modal.incomplete, syncMore = inSync && (S.modal.partial || S.modal.incomplete);
  try {
    const r = rows.length ? await applyItems(rows) : { created:0, added:0, skipped:0, uncounted:0 };
    const parts = [];
    if (r.created - r.uncounted) parts.push('新建 ' + (r.created - r.uncounted) + ' 条投递');
    if (r.uncounted) parts.push(r.uncounted + ' 封邮件没有对应的投递，已记下但不计入投递数');
    if (r.promoted) parts.push(r.promoted + ' 条原来没有投递记录的，补成了投递');
    if (r.added) parts.push('添加 ' + r.added + ' 条进展');
    if (r.skipped) parts.push('跳过 ' + r.skipped + ' 条已有投递');
    const meta = {};
    if (syncDone) meta.lastSync = todayStr();
    if (declined.length) meta.skip = (Array.isArray(S.mailsync.skip) ? S.mailsync.skip : []).concat(declined).slice(-SYNC.skipKeep);
    if (Object.keys(meta).length) await syncMeta(meta);
    if (!rows.length){ closeModal(); toast('没有保存。这 ' + declined.length + ' 封邮件下次不会再出现'); return; }
    closeModal(); toast('已保存：' + (parts.join('，') || '没有变化') + (syncMore ? '。还有更多邮件没处理，再同步一次会接着来' : ''), false, syncMore ? 6000 : 0);
  } catch(e){ fail(e); btn.disabled = false; }
}

/* ---------- sync from Gmail (read-only: search_threads, get_thread, get_message) ---------- */
const GMAIL = 'Gmail';
const SYNC = { pagesMax:20, pageSize:50, maxMsgs:150, batch:25, bodyBatch:6, bodyMax:20, bodyChars:3500, skipKeep:3000, pageGap:3000, waits:[5000, 15000, 30000], cool:[10, 30, 60], coolSoon:5 };
const GMAIL_TOPIC = 'subject:(application OR applying OR applied OR assessment OR interview OR "coding challenge" OR "take-home" OR offer OR "next steps" OR candidacy OR "phone screen" OR "thank you for your interest" OR unfortunately OR "moving forward")';
const GMAIL_FROM = 'from:(greenhouse OR lever OR ashbyhq OR workday OR myworkday OR icims OR smartrecruiters OR jobvite OR workable OR hackerrank OR codesignal OR hirevue OR codility OR karat OR recruiting OR careers OR talent OR hiring)';
const GMAIL_SKIP = '-subject:("security code" OR "verification code" OR "verify your" OR password OR "confirm your email")';
const NOISE_RE = /security code|verification code|verify your|one-time|passcode|reset your password|confirm your email|验证码/i;
const DETAIL_KINDS = ['oa', 'screen', 'interview', 'offer'];
const KIND_RANK = { oa:0, screen:0, interview:0, offer:0, rejected:1, applied:2 };

function decodeHtml(s){ const t = document.createElement('textarea'); t.innerHTML = String(s == null ? '' : s); return t.value; }
const gmailUrl = u => /^https:\/\/mail\.google\.com\//.test(u || '') ? u : '';
const cleanBody = s => String(s || '').replace(/https?:\/\/\S{30,}/g, '[link]').replace(/[ \t]+/g, ' ').replace(/\n[ \t]*/g, '\n').replace(/\n{3,}/g, '\n\n').trim().slice(0, SYNC.bodyChars);
const emailText = (m, i, body) => '[#' + (i + 1) + ']\nFrom: ' + m.sender + '\nSubject: ' + m.subject + '\nDate: ' + m.date + '\n\n' + (body || m.snippet);

function syncErr(e, phase){
  if (phase === 'claude') return sampleErr(e);
  const c = e && e.code;
  if (isQuota(e)) return 'Gmail 说它的读取额度用完了（短时间内读得太多，或者今天的额度到了），已经自动等了几次还是不行。请等到 ' + clock(Date.now() + Math.max(coolLeft(), 60000)) + ' 之后再点「开始搜索」，现在连着点只会让它拖得更久。已经处理过的邮件不会重复读。';
  return c === 'server_not_connected' || c === 'selection_required' || c === 'server_not_found' ? 'Gmail 还没有连接。到 claude.ai 的「设置 → 连接器」添加 Gmail，再回来重试。' :
    c === 'needs_reauth' ? 'Gmail 的登录过期了。到 claude.ai 的「设置 → 连接器」重新连接 Gmail，再回来重试。' :
    c === 'not_in_manifest' || c === 'consent_required' || c === 'approval_required' ? '你没有允许这个页面读取 Gmail。再点一次「开始搜索」，在弹出的窗口里选择允许。' :
    c === 'blocked_by_policy' ? '你所在的组织不允许这个页面读取 Gmail。' :
    c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed' ? '当前的打开方式不支持读取 Gmail。请在 claude.ai 里打开这个页面。' :
    c === 'server_unavailable' || c === 'upstream_error' || c === 'rate_limited' ? 'Gmail 暂时连不上，请稍后重试。' :
    c === 'tool_error' ? 'Gmail 返回了错误：' + String((e && e.message) || '').slice(0, 120) :
    c === 'bad_shape' ? 'Gmail 返回的内容读不出来，请稍后再试。' :
    '读取 Gmail 失败，请稍后再试。';
}

// Gmail 额度用完之后，几分钟内再去读只会继续被拒、还会拖得更久：记一个冷却时间，期间不再去读
let coolUntil = 0;   // 浏览器不让存时，至少在这次打开页面期间有效
const coolLeft = () => Math.max(0, Math.max(coolUntil, Number(ls.get('jt-gmail-cool')) || 0) - Date.now());
function coolStart(minutes){ coolUntil = Date.now() + minutes * 60000; ls.set('jt-gmail-cool', String(coolUntil)); }
const clock = ms => { const d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const sleep = (ms, signal) => new Promise(function(res, rej){
  if (signal && signal.aborted) return rej({ code:'cancelled' });
  const t = setTimeout(res, ms);
  if (signal) signal.addEventListener('abort', function(){ clearTimeout(t); rej({ code:'cancelled' }); }, { once:true });
});
// Gmail 说额度用完了（"Resource has been exhausted"）：多半是短时间读得太多，等一会儿就好
const isQuota = e => !!e && (e.code === 'rate_limited' || e.code === 'quota_exceeded' || /exhausted|quota|rate.?limit|too many requests/i.test(String(e.message || '')));

// 只读调用：额度用完时等 5 / 15 / 30 秒各重试一次；标了 retryable 的失败等一会儿重试一次
async function gmail(tool, input, signal, onWait){
  for (let n = 0, q = 0; ; n++){
    try {
      const r = await S.mcp.callTool(GMAIL, tool, input, { signal: signal });
      const p = r && r.payload;
      if (p && typeof p === 'object') return p;
      if (p == null || p === '') return {};
      throw { code:'bad_shape' };
    } catch(e){
      if (signal && signal.aborted) throw e;
      if (isQuota(e) && q < SYNC.waits.length){ const w = SYNC.waits[q++]; if (onWait) onWait(w); await sleep(w, signal); continue; }
      if (n === 0 && e && e.retryable){ await sleep(Math.min(5000, Math.max(800, e.retryAfterMs || 1500)), signal); continue; }
      throw e;
    }
  }
}

function syncWindow(range){
  const last = isDate(S.mailsync.lastSync) ? S.mailsync.lastSync : '';
  if (range === 'last' && last){
    const from = addDays(last, -1);   // 多搜一天，避免时区造成的漏邮件
    return { fromDate: from, from: parse(from).getTime() };
  }
  const d = Math.max(1, parseInt(range, 10) || 14);
  return { fromDate: ymd(new Date(Date.now() - d * 864e5)), from: Date.now() - d * 864e5 };
}

// 已经保存过的邮件（事件或新建的投递上记着邮件 ID），不再重复处理
function syncSeen(recheck){
  const s = new Set();
  S.apps.forEach(a => { if (a.src) s.add(a.src); (a.events || []).forEach(e => { if (e && e.src) s.add(e.src); }); });
  if (!recheck) (Array.isArray(S.mailsync.skip) ? S.mailsync.skip : []).forEach(id => { if (typeof id === 'string') s.add(id); });   // 看过、确认过、不是求职邮件或已经在记录里的
  return s;
}
// meta/mailsync：lastSync = 上次完整同步的日期；skip = 检查过、不用再看的邮件 ID（不会删掉别的字段）
function syncMeta(patch){
  S.mailsync = Object.assign({}, S.mailsync, patch);
  return save(() => S.db.doc('meta/mailsync').set(S.mailsync)).catch(function(){});
}

// 记录里已经有同一件事（同一家公司和职位、同类进展，日期或截止日期一样；拒信、Offer 有过就算）：不再列出来让人确认，保存只会多出一条重复的
function alreadyRecorded(it){
  const a = findApp(S.apps, it.company, it.role); if (!a) return false;
  return (a.events || []).some(e => e.kind === it.kind && (it.kind === 'rejected' || it.kind === 'offer' || e.date === it.date || (it.due && e.due === it.due)));
}
// 一次搜索的条件：[d0, d1) 这几天里的求职邮件。part：null = 标题关键词或招聘系统发件人（全部）；否则是 SYNC_PARTS 里的一组
const GMAIL_BASE = '-in:spam -in:trash -in:sent -in:draft -category:promotions -category:social';
const ATS_ALL = 'ashbyhq OR greenhouse OR myworkday OR workday OR workable OR lever OR icims OR smartrecruiters OR jobvite OR hackerrank OR codesignal OR hirevue OR codility OR karat OR recruiting OR careers OR talent OR hiring';
// 一天里的邮件一次装不下时，按发件人分几组再搜（几组合起来 = 全部）
const SYNC_PARTS = ['from:(ashbyhq)', 'from:(greenhouse)', 'from:(myworkday OR workday)', 'from:(workable OR lever OR icims OR smartrecruiters OR jobvite OR hackerrank OR codesignal OR hirevue OR codility OR karat)',
  'from:(recruiting OR careers OR talent OR hiring)', GMAIL_TOPIC + ' -from:(' + ATS_ALL + ')'];
function syncQuery(d0, d1, part){
  const sel = part == null ? '(' + GMAIL_TOPIC + ' OR ' + GMAIL_FROM + ')' : SYNC_PARTS[part];
  return ['after:' + d0.replace(/-/g, '/'), 'before:' + d1.replace(/-/g, '/'), GMAIL_BASE, sel, GMAIL_SKIP].join(' ');
}

/* Gmail 工具一次最多给 50 个会话，而且现在不再给「下一页」的标记，翻不了页。所以按日期把范围切小：
   一个范围搜出来正好是满的一页、又没有下一页，就当成被截断，对半切开分别再搜（最后切到一天，一天还装不下就按条件再分两次）。
   这样不会因为「看起来没有下一页」就把还没读到的邮件当成没有。 */
async function syncSearch(win, signal, progress, recheck, wait, detail){
  const seen = syncSeen(recheck), threads = [], ids = new Set(); let more = false, fresh = 0, limited = false, calls = 0;
  const add = function(t){
    if (!t || typeof t.id !== 'string' || ids.has(t.id)) return;
    ids.add(t.id); threads.push(t);
    if ((Array.isArray(t.messages) ? t.messages : []).some(m => m && !seen.has(m.id))) fresh++;
  };
  // 一个搜索条件的所有页；truncated = 第一页是满的、又没有下一页的标记（工具不给翻页）
  const one = async function(q){
    let token = '', tokened = false;
    for (let p = 0; p < SYNC.pagesMax; p++){
      if (calls++ > 0) await sleep(SYNC.pageGap, signal);   // 每次要读几十个会话，连着搜太快 Gmail 会限流
      const input = { query: q, pageSize: SYNC.pageSize, view: 'THREAD_VIEW_MINIMAL' };
      if (token) input.pageToken = token;
      const r = await gmail('search_threads', input, signal, wait);
      const list = Array.isArray(r.threads) ? r.threads : [];
      list.forEach(add);
      progress(threads.length);
      token = typeof r.nextPageToken === 'string' ? r.nextPageToken : '';
      if (token) tokened = true;
      if (!token) return { truncated: !tokened && list.length >= SYNC.pageSize };
      if (fresh >= SYNC.maxMsgs){ more = true; return { truncated: false }; }
    }
    more = true; return { truncated: false };
  };
  const range = async function(d0, d1){
    if (fresh >= SYNC.maxMsgs){ more = true; return; }
    const res = await one(syncQuery(d0, d1, null));
    if (!res.truncated) return;
    const days = diffDays(d1, d0);
    if (days > 1){ const mid = addDays(d0, Math.ceil(days / 2)); await range(mid, d1); await range(d0, mid); return; }   // 新的先搜
    for (let k = 0; k < SYNC_PARTS.length; k++){ if ((await one(syncQuery(d0, d1, k))).truncated) more = true; }   // 一天里也装不下：按发件人分组搜；某一组还装不下，就只读到一部分，下次接着来
  };
  try { await range(win.fromDate, addDays(todayStr(), 1)); }
  catch(e){ if (threads.length && isQuota(e)){ limited = true; more = true; } else throw e; }   // 已经找到的先处理，剩下的下次接着来
  // 搜索结果有时只有 ID、发件人和标题，没有日期、预览、标签（Gmail 工具返回的内容会变）：没处理过的会话要读一下完整内容才有日期。
  // 另外，搜索结果里每个会话只有最早的几封，邮件较多的会话也补读完整
  const msgsOf = t => Array.isArray(t.messages) ? t.messages : [];
  const thin = threads.filter(t => msgsOf(t).some(m => m && !m.internalDate && !m.date) && msgsOf(t).some(m => m && !seen.has(m.id))).slice(0, SYNC.maxMsgs);
  const long = threads.filter(t => thin.indexOf(t) < 0 && (Number(t.messageCount) || 0) > msgsOf(t).length).slice(0, 10);
  const need = thin.concat(long);
  for (let i = 0; i < need.length; i++){
    const t = need[i];
    await sleep(300, signal);
    if (detail) detail(i + 1, need.length);
    let r;
    try { r = await gmail('get_thread', { threadId: t.id, messageFormat: 'MINIMAL' }, signal, wait); }
    catch(e){
      if (isQuota(e)){ limited = true; break; }
      if (e && e.code === 'tool_error') continue;   // 这个会话读不出来：先跳过，不要整个同步失败（它会被算作「读不到日期」）
      throw e;
    }
    if (Array.isArray(r.messages) && r.messages.length) t.messages = r.messages;
  }
  return { threads: threads, more: more, limited: limited };
}

function syncMessages(threads, fromMs, recheck){
  const seen = syncSeen(recheck), ids = new Set(), out = [];
  let again = 0, undated = 0;
  threads.forEach(t => (Array.isArray(t.messages) ? t.messages : []).forEach(function(m){
    if (!m || typeof m.id !== 'string' || ids.has(m.id)) return;
    ids.add(m.id);
    const labels = Array.isArray(m.labelIds) ? m.labelIds : [];
    if (['SENT', 'DRAFT', 'SPAM', 'TRASH'].some(l => labels.indexOf(l) >= 0)) return;
    const ms = Number(m.internalDate) || Date.parse(m.date) || 0;
    if (!ms){ if (seen.has(m.id)) again++; else undated++; return; }   // 读不到日期的不能当成「没有新邮件」
    if (ms < fromMs) return;
    const subject = decodeHtml(m.subject).trim();
    if (NOISE_RE.test(subject)) return;
    if (seen.has(m.id)){ again++; return; }
    out.push({ id: m.id, ms: ms, date: ymd(new Date(ms)), sender: String(m.sender || '').slice(0, 120), subject: subject.slice(0, 200), snippet: decodeHtml(m.snippet).trim().slice(0, 400), url: gmailUrl(m.viewUrl) });
  }));
  out.sort((a, b) => b.ms - a.ms);
  return { msgs: out, again: again, undated: undated };
}

async function syncParse(msgs, bodies, size, signal, progress){
  const names = Array.from(new Set(S.apps.map(a => a.company))).slice(0, 80);
  const items = [];
  for (let i = 0; i < msgs.length; i += size){
    const part = msgs.slice(i, i + size);
    progress(Math.floor(i / size) + 1, Math.ceil(msgs.length / size));
    const text = part.map((m, j) => emailText(m, j, bodies && bodies[m.id])).join('\n---\n');
    const r = await S.sample.json(mailPrompt(text, names, true), { signal: signal });
    (Array.isArray(r) ? r : (r && Array.isArray(r.items) ? r.items : [])).forEach(function(x){
      const it = cleanMailItem(x); if (!it) return;
      const m = it.ref >= 1 && it.ref <= part.length ? part[it.ref - 1] : null;
      if (m && !isDate(x.date)) it.date = m.date;
      it.msg = m;
      items.push(it);
    });
  }
  return items;
}

async function syncBodies(list, signal, progress, wait){
  const bodies = {}; let n = 0, i = 0;
  async function worker(){
    while (i < list.length){
      const m = list[i++];
      try {
        const r = await gmail('get_message', { messageId: m.id, messageFormat: 'PLAIN_TEXT' }, signal, wait);
        const b = cleanBody(r.plaintextBody);
        if (b) bodies[m.id] = b;
      } catch(e){ if (e && e.code === 'cancelled') throw e; }   // 单封读不出来就沿用预览的识别结果
      progress(++n, list.length);
    }
  }
  await Promise.all([worker(), worker()]);
  return bodies;
}

function openSync(opener){
  if (!S.db || !S.mcp || !S.sample) return;
  if (!S.loaded){ toast('记录还在读取，请稍后再试', true); return; }
  S.modal = { type:'sync', ctl:null, partial:false };
  const last = isDate(S.mailsync.lastSync) && diffDays(todayStr(), S.mailsync.lastSync) >= 0 ? S.mailsync.lastSync : '';
  const opts = (last ? [['last', '自上次同步（' + short(last) + '）']] : []).concat([['3', '最近 3 天'], ['7', '最近 7 天'], ['14', '最近 14 天'], ['30', '最近 30 天']]);
  const sel = last ? 'last' : '14';
  openModal(
    '<div class="m-head"><div><h3 id="m-title">同步邮箱</h3><p>从 Gmail 找出求职相关的邮件，识别公司、OA 截止日期、面试和结果，确认后再保存。</p></div><button type="button" class="btn sm" data-act="close">关闭</button></div>' +
    '<div class="stack"><div class="sync-bar"><label class="field"><span class="lbl">时间范围</span><select id="sync-range">' +
      opts.map(o => '<option value="' + o[0] + '"' + (o[0] === sel ? ' selected' : '') + '>' + o[1] + '</option>').join('') +
    '</select></label><button type="button" class="btn primary" data-act="sync-go" id="sync-go">开始搜索</button></div>' +
    '<label class="chk"><input type="checkbox" id="sync-recheck">重新检查已经看过的邮件（默认不再重复读、不再重复确认）</label>' +
    '<p class="hint">只读：页面只能搜索和读取邮件，不能发信、删信或改标签。搜到的邮件先解析成识别结果，你确认后才会保存，不会自动改你的记录。邮件的发件人、主题和内容（验证码类邮件除外）只发给你自己的 Claude 账号来识别，不会存进页面。</p>' +
    '<div id="sync-status"></div><div id="mail-out"></div></div>', opener);
}

async function runSync(){
  const m = S.modal;
  if (!m || m.type !== 'sync' || m.ctl) return;
  if (coolLeft() > 0 && !m.force){
    $('#sync-status').innerHTML = '<p class="empty-note" style="color:var(--warn)">Gmail 刚说过它的额度用完了。请等到 ' + clock(Date.now() + coolLeft()) + ' 之后再点（还有约 ' + Math.ceil(coolLeft() / 60000) + ' 分钟）；现在连着点只会让它拖得更久。</p>' +
      '<p><button type="button" class="btn sm" data-act="sync-force">我知道，现在就试一次</button></p>';
    return;
  }
  m.force = false;
  const ctl = new AbortController(); m.ctl = ctl; m.partial = false;
  const btn = $('#sync-go'), box = $('#sync-status'), out = $('#mail-out');
  btn.disabled = true; out.innerHTML = '';
  const say = html => { if (S.modal === m) box.innerHTML = '<p class="hint">' + html + ' <button type="button" class="btn sm" data-act="mail-stop">停止</button></p>'; };
  const wait = w => say('Gmail 暂时不让读了（它的额度用完了，不是你的设置问题），等 ' + Math.round(w / 1000) + ' 秒再试…');
  let phase = 'gmail';
  try {
    const win = syncWindow($('#sync-range').value);
    say('正在搜索 Gmail…第一次使用会先问你是否允许页面读取 Gmail。');
    const recheck = !!($('#sync-recheck') && $('#sync-recheck').checked);
    const found = await syncSearch(win, ctl.signal, n => say('正在搜索 Gmail…已找到 ' + n + ' 个会话'), recheck, wait, (i, n) => say('读取邮件的日期和内容…（' + i + ' / ' + n + '）'));
    const sm = syncMessages(found.threads, win.from, recheck);
    let msgs = sm.msgs;
    if (msgs.length > SYNC.maxMsgs){ msgs = msgs.slice(0, SYNC.maxMsgs); found.more = true; }
    m.partial = found.more || found.limited;
    m.incomplete = sm.undated > 0;   // 有邮件读不到日期：这次没处理完整，不能推进「上次同步」
    if (found.limited) coolStart(SYNC.coolSoon); else ls.set('jt-gmail-cool-n', '0');
    if (!msgs.length){
      box.innerHTML = '<p class="sync-sum">' + (found.threads.length ? '没有需要处理的新邮件' + (sm.again ? '（' + sm.again + ' 封之前同步过）' : '') + '。' : '这个时间范围里没有找到求职相关的邮件。') +
        (m.incomplete ? sm.undated + ' 封邮件读不到日期，这次没能处理，过几分钟再点一次「开始搜索」。' : '') +
        (m.partial ? (found.limited ? 'Gmail 暂时限流了，过几分钟再点一次「开始搜索」会接着找。' : '再点一次「开始搜索」会接着往下找。') : '') + '</p>';
      if (!m.partial && !m.incomplete && found.threads.length) syncMeta({ lastSync: todayStr() });
      return;
    }

    // 第一轮：用发件人、主题和预览识别
    phase = 'claude';
    let items = await syncParse(msgs, null, SYNC.batch, ctl.signal, (i, n) => say('读到 ' + msgs.length + ' 封邮件，Claude 正在识别（' + i + ' / ' + n + '）…'));

    // 第二轮：OA、面试、Offer，以及预览看不出结论的，读正文核对截止日期和结果
    const pickIds = new Set(), pick = [];
    items.slice().sort((a, b) => KIND_RANK[a.kind] - KIND_RANK[b.kind]).forEach(it => {
      if (it.msg && (it.more || DETAIL_KINDS.indexOf(it.kind) >= 0) && !pickIds.has(it.msg.id)){ pickIds.add(it.msg.id); pick.push(it.msg); }
    });
    const chosen = pick.slice(0, SYNC.bodyMax);
    if (chosen.length){
      phase = 'gmail';
      const bodies = await syncBodies(chosen, ctl.signal, (i, n) => say('读取 ' + n + ' 封邮件的正文，核对截止日期和结果（' + i + ' / ' + n + '）…'), wait);
      const withBody = chosen.filter(x => bodies[x.id]);
      if (withBody.length){
        phase = 'claude';
        const again = (await syncParse(withBody, bodies, SYNC.bodyBatch, ctl.signal, (i, n) => say('Claude 正在核对正文（' + i + ' / ' + n + '）…'))).filter(it => it.msg);
        const redone = new Set(again.map(it => it.msg.id));
        items = items.filter(it => !(it.msg && redone.has(it.msg.id))).concat(again);
      }
    }

    // 已在记录里的投递确认不再列出；同一封事件只留一条
    const dup = new Set(); let hidden = 0;
    items = items.filter(function(it){
      if (it.kind === 'applied'){ const am = appliedMatch(it, S.apps); if (am && am.mode === 'skip'){ hidden++; return false; } }
      if (it.kind !== 'applied' && alreadyRecorded(it)){ hidden++; return false; }
      const key = [it.company.toLowerCase(), it.kind, it.kind === 'applied' ? it.role.toLowerCase() : it.date + '|' + it.due].join('|');
      if (dup.has(key)) return false;
      dup.add(key); return true;
    });
    items.sort((a, b) => KIND_RANK[a.kind] - KIND_RANK[b.kind] || (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));

    // 没有列出来的邮件（不是求职邮件、或投递确认已经在记录里）记下来，下次同步不用再看，也不再占 150 封的名额
    const listed = new Set(items.filter(it => it.msg).map(it => it.msg.id));
    const drop = msgs.map(x => x.id).filter(id => !listed.has(id));
    if (drop.length) syncMeta({ skip: (Array.isArray(S.mailsync.skip) ? S.mailsync.skip : []).concat(drop).slice(-SYNC.skipKeep) });

    if (S.modal !== m) return;
    box.innerHTML = '<p class="sync-sum">' + [
      '读取了 ' + msgs.length + ' 封邮件，识别出 ' + items.length + ' 项',
      hidden ? hidden + ' 项已经在记录里，没有再列出' : '',
      sm.again ? sm.again + ' 封之前同步过，已跳过' : '',
      pick.length > chosen.length ? '只核对了前 ' + chosen.length + ' 封的正文' : '',
      m.incomplete ? sm.undated + ' 封邮件读不到日期，这次没能处理，过几分钟再点一次' : '',
      m.partial ? (found.limited ? 'Gmail 暂时限流了，这次先处理已经找到的 ' + msgs.length + ' 封；过几分钟再点一次「开始搜索」，会接着处理剩下的' : '邮件太多，这次先处理最新的 ' + msgs.length + ' 封；保存后再点一次「开始搜索」，会接着处理剩下的') : ''
    ].filter(Boolean).join('；') + '。</p>';
    if (!items.length){
      out.innerHTML = '<p class="empty-note">没有识别到需要保存的求职邮件。' + (m.partial ? '再点一次「开始搜索」会接着处理剩下的。' : '') + '</p>';
      if (!m.partial && !m.incomplete) syncMeta({ lastSync: todayStr() });
      return;
    }
    renderMailItems(items);
  } catch(e){
    if (isQuota(e) && phase === 'gmail'){   // 重试几次还是被拒：先歇一阵，别再连着点
      const n = Number(ls.get('jt-gmail-cool-n')) || 0;
      coolStart(SYNC.cool[Math.min(n, SYNC.cool.length - 1)]); ls.set('jt-gmail-cool-n', String(n + 1));
    }
    if (S.modal === m){
      box.innerHTML = e && e.code === 'cancelled' ? '<p class="hint">已停止。</p>' : '<p class="empty-note" style="color:var(--warn)">' + esc(syncErr(e, phase)) + '</p>' +
        (e && (e.code === 'not_in_manifest' || e.code === 'consent_required' || e.code === 'approval_required' || e.code === 'not_granted') ? '<p><button type="button" class="btn sm" data-act="open-perms">打开权限设置</button></p>' : '');
    }
  } finally {
    if (S.modal === m){ m.ctl = null; btn.disabled = false; }
  }
}

/* ---------- progress flow (Sankey) and PNG export ---------- */
const SK = {
  W:1200, H:700, left:150, right:170, top:76, bottom:40, nodeW:14, gap:12, labelH:50, bg:'#fcfcfb',
  font:'system-ui,-apple-system,"Segoe UI","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif',
  ink:'#0b0b0b', ink2:'#52514e'
};
/* The image is its own light surface. Stages are one blue ramp (ordinal), outcomes use the status
   colors (offer = good, rejected = critical), the rest are neutrals. */
const SK_NODES = [
  { id:'apps',      col:0, color:'#52514e' },
  { id:'replies',   col:1, color:'#5598e7' },
  { id:'noreply',   col:1, color:'#c3c2b7' },
  { id:'oa',        col:2, color:'#2a78d6' },
  { id:'iv',        col:3, color:'#1c5cab' },
  { id:'offer',     col:4, color:'#0ca30c' },
  { id:'pending',   col:4, color:'#86b6ef' },
  { id:'expired',   col:4, color:'#d98c2b' },
  { id:'rejected',  col:4, color:'#d03b3b' },
  { id:'withdrawn', col:4, color:'#898781' }
];
const SK_TEXT = {
  en: { apps:'Applications', replies:'Replies', noreply:'No Replies', oa:'OA', iv:'Interviews', offer:'Offers', pending:'In Progress', expired:'OA Expired', rejected:'Rejected', withdrawn:'Withdrawn',
    title:n => 'Job search · ' + n + ' application' + (n === 1 ? '' : 's'), all:'All types', ng:'New Grad', intern:'Intern', rAll:'All time', rN:n => 'Last ' + n + ' days', asof:'as of ',
    foot:'Reply = got an OA, interview, offer or rejection. Percentages are shares of all applications.', alt:'Job search flow', from:'From', to:'To', n:'Count' },
  zh: { apps:'投递', replies:'有回音', noreply:'没回音', oa:'OA', iv:'面试', offer:'Offer', pending:'进行中', expired:'OA 过期', rejected:'被拒', withdrawn:'撤回',
    title:n => '求职进度 · 共 ' + n + ' 个投递', all:'全部类型', ng:'New Grad', intern:'Intern', rAll:'全部时间', rN:n => '最近 ' + n + ' 天', asof:'截至 ',
    foot:'回音 = 收到过 OA、面试、Offer 或拒信。百分比是占全部投递的比例。', alt:'求职进度流向图', from:'从', to:'到', n:'数量' }
};
const skr = v => Math.round(v * 10) / 10;

// Each application takes one path: apps → (no reply | reply → [OA] → [interview] → outcome)
function skFlows(list){
  const flows = {};
  const add = (a, b) => { const k = a + '>' + b; flows[k] = (flows[k] || 0) + 1; };
  list.forEach(function(a){
    const kinds = (a.events || []).map(e => e.kind);
    if (!kinds.length){ add('apps', 'noreply'); return; }
    if (kinds.every(k => k === 'withdrawn')){ add('apps', 'withdrawn'); return; }   // pulled out before any reply
    const last = kinds[kinds.length - 1], lastEv = a.events[a.events.length - 1];
    const out = kinds.indexOf('offer') >= 0 ? 'offer' : last === 'rejected' ? 'rejected' : last === 'withdrawn' ? 'withdrawn' : lastEv.kind === 'oa' && lastEv.missed ? 'expired' : 'pending';
    add('apps', 'replies');
    let prev = 'replies';
    if (kinds.indexOf('oa') >= 0){ add(prev, 'oa'); prev = 'oa'; }
    if (kinds.indexOf('screen') >= 0 || kinds.indexOf('interview') >= 0){ add(prev, 'iv'); prev = 'iv'; }
    add(prev, out);
  });
  return flows;
}

function skLayout(flows){
  const nodes = SK_NODES.map(n => ({ id:n.id, col:n.col, color:n.color, in:0, out:0 }));
  const by = {}; nodes.forEach(n => { by[n.id] = n; });
  const order = {}; SK_NODES.forEach((n, i) => { order[n.id] = i; });
  const links = Object.keys(flows).map(k => { const p = k.split('>'); return { s:by[p[0]], t:by[p[1]], v:flows[k] }; });
  links.sort((a, b) => order[a.s.id] - order[b.s.id] || order[a.t.id] - order[b.t.id]);
  links.forEach(l => { l.s.out += l.v; l.t.in += l.v; });
  nodes.forEach(n => { n.v = Math.max(n.in, n.out); });
  const live = nodes.filter(n => n.v > 0), total = by.apps.v;
  const ph = SK.H - SK.top - SK.bottom;
  const cols = [0, 1, 2, 3, 4].map(c => live.filter(n => n.col === c));
  const need = k => Math.max.apply(null, cols.map(c => c.reduce((s, n) => s + Math.max(n.v * k, SK.labelH), 0) + Math.max(0, c.length - 1) * SK.gap));
  let k = total ? ph / total : 0;
  for (let i = 0; i < 500 && k > 0.05 && need(k) > ph; i++) k *= 0.98;
  cols.forEach(function(c){
    let y = SK.top;
    c.forEach(function(n){ const slot = Math.max(n.v * k, SK.labelH); n.h = n.v * k; n.y = y + (slot - n.h) / 2; y += slot + SK.gap; });
  });
  const dx = (SK.W - SK.left - SK.right - SK.nodeW) / 4;
  live.forEach(n => { n.x = SK.left + n.col * dx; });
  const cy = n => n.y + n.h / 2;
  live.forEach(function(n){
    let o = 0;
    links.filter(l => l.s === n).sort((a, b) => cy(a.t) - cy(b.t)).forEach(l => { l.sy = n.y + o + l.v * k / 2; o += l.v * k; });
    o = 0;
    links.filter(l => l.t === n).sort((a, b) => cy(a.s) - cy(b.s)).forEach(l => { l.ty = n.y + o + l.v * k / 2; o += l.v * k; });
  });
  return { nodes:live, links:links, k:k, total:total };
}

function skList(o, counted){
  const t = todayStr();
  const from = o.range === 'all' ? '' : addDays(t, -(Number(o.range) - 1));
  return S.apps.filter(a => isCounted(a) === counted && (o.track === 'all' || trackOf(a) === o.track) && (!from || a.appliedOn >= from));
}
function skModel(o){ return skLayout(skFlows(skList(o, true))); }
const SK_HINT = '保存的是 PNG 图片（2400 × 1400）。回音 = 收到过 OA、面试、Offer 或拒信；撤回后没有任何回音的，不算有回音。OA 过期 = 收到 OA 但没在截止日期前做。';

const skPct = (v, total) => { const p = v / total * 100; return p > 0 && p < 1 ? '<1%' : Math.round(p) + '%'; };
// every label on the image (node numbers and names, title, subtitle, footnote); the SVG preview and the PNG both draw from this list
function skTexts(model, o){
  const T = SK_TEXT[o.lang], total = model.total, out = [];
  model.nodes.forEach(function(n){
    const first = n.col === 0, x = skr(first ? n.x - 12 : n.x + SK.nodeW + 10), cy = n.y + n.h / 2, an = first ? 'end' : 'start';
    out.push({ x:x, y:skr(cy - 1), an:an, size:24, weight:600, fill:SK.ink, halo:true, s:String(n.v) });
    out.push({ x:x, y:skr(cy + 18), an:an, size:14, weight:400, fill:SK.ink2, halo:true, s:T[n.id] + (first ? '' : ' · ' + skPct(n.v, total)) });
  });
  const trackLbl = T[o.track === 'ng' ? 'ng' : o.track === 'intern' ? 'intern' : 'all'];
  const rangeLbl = o.range === 'all' ? T.rAll : T.rN(o.range);
  out.push({ x:24, y:34, an:'start', size:20, weight:600, fill:SK.ink, halo:false, s:T.title(total) });
  out.push({ x:24, y:56, an:'start', size:14, weight:400, fill:SK.ink2, halo:false, s:[trackLbl, rangeLbl, T.asof + todayStr()].join(' · ') });
  out.push({ x:24, y:SK.H - 14, an:'start', size:12, weight:400, fill:SK.ink2, halo:false, s:T.foot });
  return out;
}

function skSVG(model, o){
  const T = SK_TEXT[o.lang], total = model.total;
  const halo = 'paint-order="stroke" stroke="' + SK.bg + '" stroke-width="4" stroke-linejoin="round"';
  let defs = '', links = '', nodes = '', text = '';
  model.links.forEach(function(l, i){
    const x0 = skr(l.s.x + SK.nodeW), x1 = skr(l.t.x), xm = skr((x0 + x1) / 2), sy = skr(l.sy), ty = skr(l.ty);
    defs += '<linearGradient id="skg' + i + '" gradientUnits="userSpaceOnUse" x1="' + x0 + '" y1="0" x2="' + x1 + '" y2="0"><stop offset="0" stop-color="' + l.s.color + '"/><stop offset="1" stop-color="' + l.t.color + '"/></linearGradient>';
    links += '<path d="M' + x0 + ' ' + sy + 'C' + xm + ' ' + sy + ' ' + xm + ' ' + ty + ' ' + x1 + ' ' + ty + '" fill="none" stroke="url(#skg' + i + ')" stroke-opacity=".38" stroke-width="' + skr(Math.max(l.v * model.k, 1)) + '"><title>' + esc(T[l.s.id] + ' → ' + T[l.t.id] + ': ' + l.v) + '</title></path>';
  });
  model.nodes.forEach(function(n){
    nodes += '<rect x="' + skr(n.x) + '" y="' + skr(n.y) + '" width="' + SK.nodeW + '" height="' + skr(Math.max(n.h, 2)) + '" rx="2" fill="' + n.color + '"><title>' + esc(T[n.id] + ': ' + n.v + ' (' + skPct(n.v, total) + ')') + '</title></rect>';
  });
  skTexts(model, o).forEach(function(t){
    text += '<text x="' + t.x + '" y="' + t.y + '" text-anchor="' + t.an + '" font-size="' + t.size + '"' + (t.weight !== 400 ? ' font-weight="' + t.weight + '"' : '') + ' fill="' + t.fill + '"' + (t.halo ? ' ' + halo : '') + '>' + esc(t.s) + '</text>';
  });
  const alt = T.alt + ': ' + model.nodes.map(n => T[n.id] + ' ' + n.v).join(', ');
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + SK.W + ' ' + SK.H + '" width="' + SK.W + '" height="' + SK.H + '" font-family=\'' + SK.font + '\' role="img" aria-label="' + esc(alt) + '">' +
    '<rect width="' + SK.W + '" height="' + SK.H + '" fill="' + SK.bg + '"/><defs>' + defs + '</defs>' + links + nodes + text + '</svg>';
}

/* The PNG is drawn straight onto a canvas from the same model. Loading the SVG as an <img> and drawing that
   fails in hosts that block data: images or taint the canvas after an SVG is drawn ("生成图片失败"). */
function skPNG(model, o){
  const sc = 2, c = document.createElement('canvas'); c.width = SK.W * sc; c.height = SK.H * sc;
  const g = c.getContext('2d');
  if (!g) return Promise.reject(new Error('canvas unavailable'));
  g.scale(sc, sc);
  g.fillStyle = SK.bg; g.fillRect(0, 0, SK.W, SK.H);
  model.links.forEach(function(l){
    const x0 = l.s.x + SK.nodeW, x1 = l.t.x, xm = (x0 + x1) / 2, gr = g.createLinearGradient(x0, 0, x1, 0);
    gr.addColorStop(0, l.s.color); gr.addColorStop(1, l.t.color);
    g.globalAlpha = .38; g.strokeStyle = gr; g.lineWidth = Math.max(l.v * model.k, 1);
    g.beginPath(); g.moveTo(x0, l.sy); g.bezierCurveTo(xm, l.sy, xm, l.ty, x1, l.ty); g.stroke();
  });
  g.globalAlpha = 1;
  model.nodes.forEach(function(n){
    g.fillStyle = n.color; g.beginPath();
    if (g.roundRect) g.roundRect(n.x, n.y, SK.nodeW, Math.max(n.h, 2), 2); else g.rect(n.x, n.y, SK.nodeW, Math.max(n.h, 2));
    g.fill();
  });
  g.lineJoin = 'round'; g.textBaseline = 'alphabetic';
  skTexts(model, o).forEach(function(t){
    g.font = t.weight + ' ' + t.size + 'px ' + SK.font; g.textAlign = t.an === 'end' ? 'right' : 'left';
    if (t.halo){ g.lineWidth = 4; g.strokeStyle = SK.bg; g.strokeText(t.s, t.x, t.y); }
    g.fillStyle = t.fill; g.fillText(t.s, t.x, t.y);
  });
  return new Promise(function(res, rej){
    try { c.toBlob(b => b ? res(b) : rej(new Error('toBlob returned nothing')), 'image/png'); } catch(e){ rej(e); }
  });
}

function openSankey(opener){
  if (!S.db) return;
  S.modal = { type:'sankey', track:S.track, range:'all', lang: ls.get('jt-sk-lang') === 'zh' ? 'zh' : 'en', busy:false };
  const m = S.modal;
  const sel = (id, lbl, opts, cur) => '<label class="field"><span class="lbl">' + lbl + '</span><select id="' + id + '">' + opts.map(o => '<option value="' + o[0] + '"' + (o[0] === cur ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select></label>';
  openModal(
    '<div class="m-head"><div><h3 id="m-title">进度图</h3><p>把投递到结果的流向画成一张图，可以保存成图片分享。</p></div><button type="button" class="btn sm" data-act="close">关闭</button></div>' +
    '<div class="stack"><div class="sk-bar">' +
      sel('sk-track', '类型', [['all', '全部'], ['ng', 'New Grad'], ['intern', 'Intern']], m.track) +
      sel('sk-range', '投递日期', [['all', '全部时间'], ['30', '最近 30 天'], ['14', '最近 14 天'], ['7', '最近 7 天']], m.range) +
      sel('sk-lang', '图中文字', [['en', 'English'], ['zh', '中文']], m.lang) +
      '<button type="button" class="btn primary" id="sk-save" data-act="sk-save">保存图片</button></div>' +
    '<div class="sk-fig" id="sk-fig"></div>' +
    '<p class="sk-note" id="sk-hint">' + SK_HINT + '</p>' +
    '<details class="sk-data"><summary>查看数据表</summary><div class="sk-tbl" id="sk-table"></div></details></div>', opener);
  renderSankey();
}

function renderSankey(){
  const m = S.modal; if (!m || m.type !== 'sankey') return;
  const model = skModel(m), box = $('#sk-fig'), T = SK_TEXT[m.lang];
  const un = skList(m, false), unRej = un.filter(a => statusOf(a) === 'rejected').length;
  $('#sk-hint').textContent = SK_HINT + (un.length ? ' 没有投递记录的 ' + un.length + ' 条（其中拒信 ' + unRej + ' 封）不算投递，没有画进图里。' : '');
  $('#sk-save').disabled = !model.total;
  if (!model.total){
    box.innerHTML = '<p class="empty-note" style="padding:20px">这个范围里还没有投递记录。</p>';
    $('#sk-table').innerHTML = '';
    return;
  }
  box.innerHTML = '<div class="sk-scroll">' + skSVG(model, m) + '</div>';
  $('#sk-table').innerHTML = '<table><thead><tr><th>' + T.from + '</th><th>' + T.to + '</th><th class="n">' + T.n + '</th></tr></thead><tbody>' +
    model.links.map(l => '<tr><td>' + esc(T[l.s.id]) + '</td><td>' + esc(T[l.t.id]) + '</td><td class="n">' + l.v + '</td></tr>').join('') + '</tbody></table>';
}

async function saveSankey(){
  const m = S.modal;
  if (!m || m.type !== 'sankey' || m.busy) return;
  const model = skModel(m); if (!model.total) return;
  m.busy = true; $('#sk-save').disabled = true;
  let blob = null;
  try {
    blob = await skPNG(model, m);
    const name = 'job-search-' + todayStr() + '.png';
    if (S.mode === 'cloud'){
      if (!S.dl) throw { code:'unavailable' };
      await S.dl.save({ filename:name, data:blob });
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    }
    toast('已保存图片');
  } catch(e){
    const c = e && e.code;
    if (c === 'declined') toast('没有保存');
    else if (c === 'rate_limited') toast('请稍等几秒再点一次', true);
    else if (blob && S.modal === m){
      // 这个环境不能直接下载：把图片显示出来，让你长按或右键保存
      $('#sk-fig').innerHTML = '<img alt="' + esc(SK_TEXT[m.lang].alt) + '" src="' + URL.createObjectURL(blob) + '">';
      $('#sk-hint').textContent = '这里不能直接下载。请长按（电脑上右键）上面的图片，选「存储图片」或「图片另存为」。改动上面的选项会回到可编辑的预览。';
    } else toast('生成图片失败（' + String((e && (e.message || e.name || e.code)) || '未知原因').slice(0, 80) + '），请再试一次', true, 6000);
  } finally {
    m.busy = false;
    if (S.modal === m) $('#sk-save').disabled = false;
  }
}

/* ---------- local storage backend (used when the page runs outside claude.ai) ---------- */
function banner(msg){ const b = $('#banner'); b.textContent = msg; b.hidden = false; }
function makeLocalDB(){
  const KEY = 'job-application-tracker:v1';
  let store = {}, persistent = true;
  try {
    localStorage.setItem(KEY + ':t', '1'); localStorage.removeItem(KEY + ':t');
    const raw = localStorage.getItem(KEY); if (raw) store = JSON.parse(raw) || {};
  } catch(e){ persistent = false; }
  if (!persistent) banner('这个浏览器不允许保存数据（可能是无痕模式），关闭页面后记录会丢失。');
  const subs = [];
  const clone = v => JSON.parse(JSON.stringify(v));
  const emit = () => subs.slice().forEach(f => { try { f(); } catch(e){ console.error(e); } });
  function persist(){
    if (!persistent) return;
    try { localStorage.setItem(KEY, JSON.stringify(store)); }
    catch(e){ persistent = false; banner('浏览器存储已满或被禁用，新的记录不会保存。请先导出备份。'); }
  }
  window.addEventListener('storage', function(ev){
    if (ev.key !== KEY) return;
    try { store = ev.newValue ? JSON.parse(ev.newValue) : {}; } catch(e){ return; }
    emit();
  });
  const mkDoc = path => ({ id: path.split('/').pop(), exists: path in store, data: () => path in store ? clone(store[path]) : undefined });
  const inCol = col => Object.keys(store).filter(p => p.indexOf(col + '/') === 0 && p.split('/').length === col.split('/').length + 1);
  const mint = () => 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const sub = function(fn){ subs.push(fn); setTimeout(fn, 0); return function(){ const i = subs.indexOf(fn); if (i >= 0) subs.splice(i, 1); }; };
  function docRef(path){
    return {
      id: path.split('/').pop(), path: path,
      get: async () => mkDoc(path),
      set: async d => { store[path] = clone(d); persist(); emit(); },
      update: async d => { if (!(path in store)) throw { code:'invalid_argument', message:'missing' }; store[path] = Object.assign({}, store[path], clone(d)); persist(); emit(); },
      delete: async () => { delete store[path]; persist(); emit(); },
      onSnapshot: next => sub(() => next(mkDoc(path)))
    };
  }
  function colRef(col){
    const snap = () => { const docs = inCol(col).map(mkDoc); return { docs: docs, size: docs.length, empty: !docs.length }; };
    const q = { path: col, doc: id => docRef(col + '/' + (id || mint())),
      add: async d => { const r = docRef(col + '/' + mint()); await r.set(d); return r; },
      limit: () => q, where: () => q, orderBy: () => q,
      get: async () => snap(), onSnapshot: next => sub(() => next(snap())) };
    return q;
  }
  const FIELDS = ['company','role','track','appliedOn','link','location','notes','events','src','uncounted','createdAt','updatedAt'];
  return {
    doc: docRef, collection: colRef,
    exportAll: function(){
      return { format:'job-application-tracker', version:1, exportedAt:new Date().toISOString(),
        apps: inCol('apps').map(p => Object.assign({ id: p.split('/').pop() }, clone(store[p]))),
        settings: store['meta/settings'] ? clone(store['meta/settings']) : {} };
    },
    importAll: function(obj){
      if (!obj || obj.format !== 'job-application-tracker' || !Array.isArray(obj.apps)) throw new Error('format');
      let n = 0;
      obj.apps.forEach(function(a){
        if (!a || typeof a.id !== 'string' || !/^[A-Za-z0-9_-]{1,100}$/.test(a.id) || typeof a.company !== 'string') return;
        const d = {}; FIELDS.forEach(k => { if (a[k] !== undefined) d[k] = clone(a[k]); });
        store['apps/' + a.id] = d; n++;
      });
      if (obj.settings && typeof obj.settings === 'object') store['meta/settings'] = Object.assign({}, store['meta/settings'] || {}, clone(obj.settings));
      persist(); emit();
      return n;
    }
  };
}

/* US federal holidays (a Saturday holiday is observed on Friday, a Sunday one on Monday). USCIS counts premium
   processing in business days, so weekends and these days are skipped when the 30-day deadline is estimated. */
function usHolidays(y){
  const nth = (m, wd, n) => { const d = new Date(y, m, 1); let c = 0; for (;;){ if (d.getDay() === wd && ++c === n) return ymd(d); d.setDate(d.getDate() + 1); } };
  const last = (m, wd) => { const d = new Date(y, m + 1, 0); while (d.getDay() !== wd) d.setDate(d.getDate() - 1); return ymd(d); };
  const obs = (m, day) => { const d = new Date(y, m, day), w = d.getDay(); if (w === 6) d.setDate(day - 1); else if (w === 0) d.setDate(day + 1); return ymd(d); };
  return [obs(0, 1), nth(0, 1, 3), nth(1, 1, 3), last(4, 1), obs(5, 19), obs(6, 4), nth(8, 1, 1), nth(9, 1, 2), obs(10, 11), nth(10, 4, 4), obs(11, 25)];
}
function addBusinessDays(start, n){
  const hol = {}, y0 = parse(start).getFullYear();
  [y0, y0 + 1, y0 + 2].forEach(y => usHolidays(y).forEach(h => { hol[h] = 1; }));
  let d = start, c = 0;
  while (c < n){ d = addDays(d, 1); const w = parse(d).getDay(); if (w !== 0 && w !== 6 && !hol[d]) c++; }

        '</div>' +
      '</div>' +
      '<div class="full form-foot" style="margin-top:0"><span class="note">只作提醒，不是法律意见。</span><button type="submit" class="btn primary" id="g-save">保存</button></div>' +
    '</form>', opener);
  $('#g-date').focus();
}
async function saveGrad(){
  const v = id => { const x = $('#' + id).value; return isDate(x) ? x : ''; };
  const btn = $('#g-save'); btn.disabled = true;
  const opt = { on: $('#g-on').checked, dsoDate:v('g-dso'), filedDate:v('g-filed'), reqStart:v('g-req'), pp: $('#g-pp').checked, ppDate:v('g-ppdate'), rfeDate:v('g-rfe'),
    receiptDate:v('g-receipt'), bioDate:v('g-bio'), bioDone: $('#g-biodone').checked, approvedDate:v('g-approved'), cardDate:v('g-card'), startDate:v('g-start'), endDate:v('g-end'),
    jobStart:v('g-job'), extraDays: Math.max(0, Math.min(365, Math.floor(Number($('#g-extra').value) || 0))), stemOn: $('#g-stem').checked, stemDso:v('g-sdso'), stemFiled:v('g-sfiled'), stemApproved:v('g-sappr') };
  await saveSettings({ gradDate: v('g-date'), opt: opt });
  closeModal(); toast('已保存');
}

/* ---------- goal ---------- */
let goalT;
function changeGoal(d){
  S.goal = Math.min(50, Math.max(1, S.goal + d));
  render();
  clearTimeout(goalT);
  goalT = setTimeout(function(){
    if (S.db) saveSettings({ dailyGoal: S.goal });
  }, 600);
}

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  const t = e.target;
  const open = t.closest('[data-open]');
  if (open){ openDetail(open.dataset.open, open); return; }
  const act = t.closest('[data-act]');
  if (act){
    const a = act.dataset.act;
    if (a === 'open-add') openAdd(act);
    else if (a === 'close') closeModal();
    else if (a === 'goal') changeGoal(Number(act.dataset.d));
    else if (a === 'add-mode'){
      S.modal.mode = act.dataset.mode;
      document.querySelectorAll('[data-act=add-mode]').forEach(b => b.setAttribute('aria-pressed', String(b === act)));
      $('#add-single').hidden = S.modal.mode !== 'single';
      $('#add-bulk-wrap').hidden = S.modal.mode !== 'bulk';
      (S.modal.mode === 'single' ? $('#add-company') : $('#add-bulk')).focus();
    }
    else if (a === 'done'){
      const app = S.apps.find(x => x.id === act.dataset.id), evId = act.dataset.ev;
      if (app) patchEvents(app, evs => evs.map(x => x.id === evId ? setDone(x, true) : x)).then(ok => { if (ok) openNext(app.id, evId, null); });
    }
    else if (a === 'missed'){
      const app = S.apps.find(x => x.id === act.dataset.id), evId = act.dataset.ev;
      if (app) patchEvents(app, evs => evs.map(x => x.id === evId ? setMissed(x, true) : x)).then(ok => { if (ok) toast(app.company + '：OA 已标为过期没做'); });
    }
    else if (a === 'toggle-missed'){
      const app = cur(); if (app) patchEvents(app, evs => evs.map(x => x.id === act.dataset.ev ? setMissed(x, true) : x));
    }
    else if (a === 'open-perms'){
      (async function(){
        try { const P = await window.claude.use('permissions'); await P.manage(); }
        catch(err){ toast('打不开权限面板，请用页面上方的「权限」菜单', true); }
      })();
    }
    else if (a === 'next') openNext(act.dataset.id, act.dataset.ev, act);
    else if (a === 'nx-pick') pickNext(act.dataset.k);
    else if (a === 'toggle-done'){
      const app = cur(); if (app) patchEvents(app, evs => evs.map(x => x.id === act.dataset.ev ? setDone(x, !x.done) : x));
    }
    else if (a === 'del-ev'){
      const app = cur(); if (app) patchEvents(app, evs => evs.filter(x => x.id !== act.dataset.ev));
    }
    else if (a === 'del-app') deleteApp(act);
    else if (a === 'open-todo') openTodo(act);
    else if (a === 'open-mail') openMail(act);
    else if (a === 'sort-recent'){ S.sort = 'recent'; $('#sort').value = 'recent'; render(); }
    else if (a === 'open-sankey') openSankey(act);
    else if (a === 'sk-save') saveSankey();
    else if (a === 'open-sync') openSync(act);
    else if (a === 'sync-go') runSync();
    else if (a === 'sync-force'){ if (S.modal && S.modal.type === 'sync'){ S.modal.force = true; coolUntil = 0; ls.set('jt-gmail-cool', ''); runSync(); } }
    else if (a === 'mail-all' || a === 'mail-none'){
      $$('.mail-item').forEach(el => { el.querySelector('[data-f=on]').checked = a === 'mail-all'; syncMailItem(el); });
      syncMailSel();
    }
    else if (a === 'mail-parse') parseMail();
    else if (a === 'mail-stop'){ if (S.modal && S.modal.ctl) S.modal.ctl.abort(); }
    else if (a === 'mail-save') saveMail();
    else if (a === 'mail-prompt') mailPromptCopy();
    else if (a === 'mail-json') readMailJson();
    else if (a === 'open-grad') openGrad(act, act.dataset.opt === '1');
    else if (a === 'export') exportData();
    return;
  }
  const tr = t.closest('[data-track]');
  if (tr){ S.track = tr.dataset.track; ls.set('jt-track', S.track); render(); return; }
  if (t.id === 'overlay') closeModal();
});

document.addEventListener('submit', function(e){
  e.preventDefault();
  if (e.target.id === 'add-form') submitAdd();
  else if (e.target.id === 'ev-form') submitEvent();
  else if (e.target.id === 'nx-form') submitNext();
  else if (e.target.id === 'info-form') submitInfo();
  else if (e.target.id === 'todo-form') submitTodo();
  else if (e.target.id === 'grad-form') saveGrad();
});

document.addEventListener('input', function(e){
  if (e.target.id === 'q'){ S.q = e.target.value; render(); }
  else if (e.target.id === 'todo-company') syncTodo();
  else if (e.target.closest && e.target.closest('.mail-item') && (e.target.dataset.f === 'company' || e.target.dataset.f === 'role')) syncMailItem(e.target.closest('.mail-item'));
  else if (e.target.id === 'add-bulk'){
    const n = e.target.value.split('\n').map(parseLine).filter(Boolean).length;
    $('#bulk-count').textContent = n ? '识别到 ' + n + ' 个投递' : '用逗号、竖线或「 - 」分隔公司和职位，职位可以不写。';
  }
});
document.addEventListener('change', function(e){
  if (e.target.id === 'status'){
    S.status = e.target.value;
    // 看 OA / 面试 / Offer / 拒信 / 撤回时，最关心的是最近的进展，自动按最近进展排；回到全部或已投递就按投递日期排
    S.sort = ['oa', 'expired', 'interview', 'offer', 'rejected', 'withdrawn'].indexOf(S.status) >= 0 ? 'recent' : 'applied';
    $('#sort').value = S.sort; render();
  }
  else if (e.target.id === 'sort'){ S.sort = e.target.value === 'recent' ? 'recent' : 'applied'; render(); }
  else if (e.target.id === 'sk-track' || e.target.id === 'sk-range' || e.target.id === 'sk-lang'){
    if (!S.modal || S.modal.type !== 'sankey') return;
    S.modal[e.target.id.slice(3)] = e.target.value;
    if (e.target.id === 'sk-lang') ls.set('jt-sk-lang', e.target.value);
    renderSankey();
  }
  else if (e.target.id === 'ev-kind') syncDue();
  else if (e.target.id === 'g-on') $('#g-opt').hidden = !e.target.checked;
  else if (e.target.id === 'g-stem') $('#g-stemwrap').hidden = !e.target.checked;
  else if (e.target.id === 'g-pp') $('#g-ppwrap').hidden = !e.target.checked;
  else if (e.target.id === 'imp-file'){
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = function(){
      try { const n = S.db.importAll(JSON.parse(String(rd.result))); toast('已导入 ' + n + ' 条投递'); }
      catch(err){ toast('这个文件不是本工具导出的备份', true); }
    };
    rd.readAsText(f); e.target.value = '';
  }
  else if (e.target.id === 'todo-kind') $('#todo-due-lbl').textContent = (KINDS[e.target.value].due) + '日期';
  else if (e.target.closest && e.target.closest('.mail-item')){ syncMailItem(e.target.closest('.mail-item')); syncMailSel(); }
  else if (e.target.id === 'mail-file'){
    const f = e.target.files && e.target.files[0]; if (!f) return;
    if (f.size > 400000){ toast('文件太大，请直接粘贴邮件正文', true); e.target.value = ''; return; }
    const rd = new FileReader();
    rd.onload = function(){ const ta = $('#mail-text'); if (ta) ta.value = (ta.value ? ta.value + '\n---\n' : '') + String(rd.result).slice(0, 60000); };
    rd.readAsText(f); e.target.value = '';
  }
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && S.modal) closeModal(); });
let lastW = 0, rz = 0;
window.addEventListener('resize', function(){
  cancelAnimationFrame(rz);
  rz = requestAnimationFrame(function(){ const w = $('#chart').clientWidth; if (Math.abs(w - lastW) > 8){ lastW = w; render(); } });
});
$('#chart').addEventListener('pointerover', function(e){ const h = e.target.closest('.hit'); if (h) showDay(h.dataset.day); });
$('#chart').addEventListener('click', function(e){ const h = e.target.closest('.hit'); if (h) showDay(h.dataset.day); });

/* ---------- boot ---------- */
$('#status').value = S.status; $('#sort').value = S.sort;
renderFoot();
render();
(async function(){
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch(e){ db = null; }
  if (!db){ db = makeLocalDB(); S.mode = 'local'; }
  S.db = db;
  renderFoot();
  const onErr = function(){ S.loaded = true; banner('读取数据时出错，请刷新页面再试。'); render(); };
  db.collection('apps').limit(1000).onSnapshot(function(snap){
    S.apps = snap.docs.map(function(d){
      const x = d.data() || {};
      return Object.assign({}, x, {
        id: d.id,
        company: String(x.company || '未命名'),
        appliedOn: isDate(x.appliedOn) ? x.appliedOn : (x.createdAt ? ymd(new Date(x.createdAt)) : todayStr()),
        events: Array.isArray(x.events) ? x.events.filter(e => e && e.kind) : []
      });
    });
    S.loaded = true;
    render();
  }, onErr);
  db.doc('meta/settings').onSnapshot(function(s){
    S.settings = s.exists ? Object.assign({}, s.data()) : {};
    const g = Number(S.settings.dailyGoal);
    if (g >= 1 && g <= 50) S.goal = Math.round(g);
    render();
  }, function(){});
  db.doc('meta/mailsync').onSnapshot(function(s){ S.mailsync = s.exists ? Object.assign({}, s.data()) : {}; }, function(){});
  if (S.mode === 'cloud'){
    try { S.sample = window.claude.use ? await window.claude.use('sample') : null; } catch(e){ S.sample = null; }
    try { S.mcp = window.claude.use ? await window.claude.use('mcp') : null; } catch(e){ S.mcp = null; }
    try { S.dl = window.claude.use ? await window.claude.use('downloads') : null; } catch(e){ S.dl = null; }
    if (S.mcp && S.sample) $('#btn-sync').hidden = false;
  }
})();
})();
</script>
</body>
</html>
